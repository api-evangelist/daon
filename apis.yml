aid: daon

name: Daon

description: Daon, which calls itself the Digital Identity Trust Company, enables organizations worldwide to proof, verify, authenticate and secure
  identities across the customer lifecycle. Its product suite includes the IdentityX hosted platform and the TrustX SaaS identity verification
  and orchestration platform, plus xAuth multi-factor authentication, xProof identity verification (IDV), xFace facial authentication, xVoice
  voice authentication and xDeTECH synthetic/deepfake detection. Developers integrate through the TrustX REST API documented at docs.trustx.com
  and through mobile SDKs (face, FIDO, NFC) published in the daoninc GitHub organization.

