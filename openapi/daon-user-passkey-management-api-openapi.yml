components:
  schemas:
    DisplayPNGCharacteristicsDescriptor:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        bitDepth:
          type: integer
          format: int32
        colorType:
          type: integer
          format: int32
        compression:
          type: integer
          format: int32
        filter:
          type: integer
          format: int32
        interlace:
          type: integer
          format: int32
        plte:
          type: array
          items:
            $ref: '#/components/schemas/RgbPaletteEntry'
    PasscodeSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        policyName:
          type: string
          description: Identifies the identity store passcode policy.
        status:
          type: string
          description: The status of the user passcode.
          enum:
          - ACTIVE
          - DISABLED
        lastRenewedDtm:
          type: string
          format: date-time
          description: The last time the passcode was renewed. Only present if a renewal has occurred.
        expirationDate:
          type: string
          format: date
          description: Expiration date for a passcode. Only required if regular renewals are enforced.
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this passcode has not been used for authentication then this field is not present.
    PasscodeAuditDisplayDto:
      type: object
      description: A Passcode audit DTO, 1 to 1 mapped to what should be shown in UI for passcode authentication audit.
      properties:
        policyName:
          type: string
        algorithm:
          type: string
          enum:
          - SRP
        algorithmVariant:
          type: string
        registrationDtm:
          type: string
          format: date-time
        authenticationDtm:
          type: string
          format: date-time
    FIDORegistrationResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/OperationHeader'
        fcParams:
          type: string
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticatorRegistrationAssertion'
    RegisterCredentialHolder:
      type: object
      description: 'Request to the API which completes passkey registration when session management is external. Contains the user agent response and session data object


        In this case the passkey configuration `sessionManagementExternal` is set to `true` so the session data is returned by the server when passkey registration is requested an must be provided back the server when the registration is completed.


        '
      properties:
        clientResponse:
          $ref: '#/components/schemas/RegisterCredential'
          description: Passkey registration information returned from the user agent.
        session:
          $ref: '#/components/schemas/PasskeySessionData'
          description: The session data created when the passkey registration was requested.
    ServerAuthenticatorAttestationResponse:
      type: object
      properties:
        clientDataJSON:
          type: string
          minLength: 1
        attestationObject:
          type: string
          minLength: 1
        transports:
          type: array
          items:
            type: string
            enum:
            - usb
            - nfc
            - ble
            - hybrid
            - internal
    DeviceSummary:
      type: object
      description: 'Summary information about a device containing keys registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: 'A unique identifier of the device on which the keys are installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        rpId:
          type: string
          description: The relying party ID.
        os:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        name:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        keys:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AppkeySummary'
          description: 'A map of appkey types to list of key summary information where the key types are:

            - **DEVICE**: A device appkey which authenticates the device without user input.

            - **BIOMETRIC**: A biometric appkey which authenticates the user using a biometric.

            List is here to support "more than one app keys of the same type" concept, but in most cases we expect the size of it will be one.'
    AuthenticationExtensionsClientOutputs:
      type: object
      properties:
        appid:
          type: boolean
        txAuthSimple:
          type: string
        txAuthGeneric:
          type: string
        authnSel:
          type: boolean
        exts:
          type: array
          items:
            type: string
        uvi:
          type: string
        loc:
          $ref: '#/components/schemas/Coordinates'
        biometricPerfBounds:
          type: boolean
        credProps:
          $ref: '#/components/schemas/CredentialPropertiesOutput'
    IdStoreSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    RegistrationPasskeyInfo:
      type: object
      properties:
        id:
          type: string
          description: The ID of the passkey in the database.
        rpId:
          type: string
          description: The relying party ID.
        regPolicyName:
          type: string
          description: The registration policy defined for the relying party.
        registerCredential:
          $ref: '#/components/schemas/RegisterCredential'
          description: Protocol-specific information related to the registration.
        registerPasskeyRequest:
          $ref: '#/components/schemas/RegOptionResponse'
          description: The public key credential creation options to be supplied to the user agent to create and register a new passkey credential.
        metadata:
          $ref: '#/components/schemas/TrustWebClientMetadata'
          description: Metadata about the client.
        context:
          type: object
          additionalProperties:
            type: object
          description: Context data about the client.
    LocationByIpInfo:
      type: object
      description: Location metadata
      properties:
        ipAddress:
          type: string
        country:
          type: string
        city:
          type: string
    ServerPublicKeyCredentialDescriptor:
      type: object
      properties:
        type:
          type: string
          enum:
          - public-key
        id:
          type: string
        transports:
          type: array
          items:
            type: string
            enum:
            - usb
            - nfc
            - ble
            - hybrid
            - internal
    AuthenticationExtensionsClientInputs:
      type: object
      properties:
        appid:
          type: string
        txAuthSimple:
          type: string
        txAuthGeneric:
          $ref: '#/components/schemas/TxAuthGenericAlg'
        authnSel:
          type: array
          items:
            type: string
        line_authnSel:
          type: array
          items:
            type: string
        exts:
          type: boolean
        uvi:
          type: boolean
        loc:
          type: boolean
        biometricPerfBounds:
          $ref: '#/components/schemas/AuthenticatorBiometricPerfBounds'
        credProps:
          type: boolean
        credentialProtectionPolicy:
          type: string
