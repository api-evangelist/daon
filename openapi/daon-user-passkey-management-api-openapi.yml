        If in the passkey configuration `sessionManagementExternal` is set to `false` then session data are managed internally by the server and this object will contain a session ID which must be provided when the authentication is completed. Otherwise if `sessionManagementExternal` is `true` the session data itself is included in this object and must be provided when the authentication is completed.


