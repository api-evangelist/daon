      properties:
        contentType:
          type: string
          description: The mime type of the enrolled audio. For example `audio/wav`.
        enrolledAudio:
          type: string
          format: byte
          description: The enrolled audio data in the format described by `contentType`.
    Coordinates:
      type: object
      properties:
        latitude:
          type: number
