              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **390**: Passkey not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUserPasskeyByExtUserId
    delete:
      tags:
