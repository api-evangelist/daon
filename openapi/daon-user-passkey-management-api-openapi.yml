  /api/identity-store/stores/{storeName}/passkeys/authentications:
    post:
      tags:
      - User Passkey Management
      summary: Complete a passkey authentication for an externally managed session
      description: 'This API is used to complete a passkey authentication where the passkey configuration `sessionManagementExternal` parameter is set to `true` which means that the session data object was returned when the authentication was requested and must be provided back to the server along with the response from the client.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completePasskeyAuthenticationWithSession` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completePasskeyAuthenticationWithSession`'
      operationId: completePasskeyAuthenticationWithSession
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The client authentication response and session data object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCredentialHolder'
        required: true
      responses:
        '200':
          description: Passkey authentication completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCredentialResult'
        '400':
          description: 'An error occurred either on the server or the client. Not all the error codes are listed here as there are many and a lot of them are unlikely to occur when integrating a validated passkey client.


            **NOTE** For convenience the updated user object is returned when there is an authentication error because it may contain updated information about the user lock state.


            Some of the more likely errors are:

            - **348**: The passkey matching the supplied credential ID is not active

            - **352**: The supplied client response message is not an authentication, it''s a registration

            - **353**: The provided challenge is not the same as the challenge signed in the assertion

            - **354**: The origin in the client response is not in the restricted origins list

            - **356**: Token binding in the client response does not match the expected value

            - **356**: Token binding status missing from client response

            - **362**: No passkey was found matching the supplied credential ID

            - **363**: The passkey matching the supplied credential ID does not match the expected user

            - **364**: The authentication credential is not in the allowed credentials list

            - **364**: There is not user handle for this passkey and relying party ID found for the user

            - **365**: The user handle in the assertion does not match the expected user handle

            - **372**: Possible cloned authenticator. The signature counter is out of synch.

            - **382**: The origin in the client response does not start with https

            - **383**: The origin in the client response does not match the relying party ID

            - **384**: Session data not provided

            - **386**: Session data is missing the challenge

            - **387**: Session data is missing the relying party ID

            - **394**: Session data is missing authentication policy name

            - **395**: Operation success/failure response data not provided

            - **397**: Passkey authentication failed on the client

            - **398**: Passkey authentication was cancelled on the client

            - **403**: Passkey authentication timed out on the client

            - **502**: The user associated with this authentication is not active- **2100**: The user is locked. Authentication cannot proceed.

            - **2101**: The user passkey modality is locked. Authentication cannot proceed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
              example:
                code: '401'
                message: Authentication failed
                user:
                  id: EEWOIHIJ3CJYXAKIRGAMEIUJGU
                  status: ACTIVE
                  extId: '12345678'
                  locale:
                    language: en
                    country: US
                  timezone: Europe/London
                  firstName: John
                  lastName: Does
                  email: jd@mail.com
                  dateOfBirth: {}
                  nationalities:
                  - US
                  locks:
                    lockCounter: 1
                  createdDtm: {}
                  lastUpdatedDtm: {}
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **234**: Passkey authentication policy not found

            - **235**: Passkey relying party ID not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completePasskeyAuthenticationWithSession
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
