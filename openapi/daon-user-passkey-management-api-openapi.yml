openapi: 3.2.0
info:
  title: Daon User Passkey Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Passkey Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Passkey Management
paths:
  /api/identity-store/stores/{storeName}/users/{userExtId}/passkeys/relyingParties/{rpId}/registrations/{regPolicyName}/ext:
    post:
      tags:
      - User Passkey Management
      summary: Create a passkey credential creation request for an existing user identified by…
      description: 'The credential creation request returned from the server must be supplied to the user agent on the device to initiate a passkey registration. The response from the user agent is returned to the server to complete registration and store the generated paskey in the server.


        Session data is shared between the registration request and completion API calls. If in the passkey configuration `sessionManagementExternal` is set to `false` then these session data are managed internally by the server and a session ID is returned by this API which must be provided when the registration is completed. Otherwise if `sessionManagementExternal` is `true` the session data itself is returned by the API and must be provided when the registration is completed. If session data is managed internally it is stored temporarily for the duration configured as `sessionDuration`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createPasskeyRegistrationForUserByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createPasskeyRegistrationForUserByExtId`'
      operationId: createPasskeyRegistrationForUserByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose passkey registration configuration will be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: regPolicyName
        in: path
        description: The name of the passkey registration policy for the relying party
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Additional registration parameters. May be empty.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendedRegistrationParameters'
        required: true
      responses:
        '201':
          description: Passkey credential creation request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegOptionResponseHolder'
        '400':
          description: 'An error occurred. Possible error codes

            - **1120**: The user is not in a state to allow passkey registration

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **235**: Passkey relying party ID not found

            - **233**: Passkey registration policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createPasskeyRegistrationForUserByExtId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/passkeys/registrations/sessions/{sessionId}:
    post:
      tags:
      - User Passkey Management
      summary: Complete a passkey credential creation request for an internally managed session
      description: 'This API is used to complete a passkey registration where the passkey configuration `sessionManagementExternal` parameter is set to `false` which means that a session ID of an internally managed session was returned when the registration was requested and must be provided back to the server along with the response from the client.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completePasskeyRegistrationWithSessionId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completePasskeyRegistrationWithSessionId`'
      operationId: completePasskeyRegistrationWithSessionId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: sessionId
        in: path
        description: The session ID returned by the server when the registration was requested
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user agent registration response message and session data object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCredential'
        required: true
      responses:
        '200':
          description: Passkey registration completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCredentialResult'
        '400':
          description: 'An error occurred either on the server or the client. Not all the error codes are listed here as there are many and a lot of them are unlikely to occur when integrating with a valid user agent. Some of the more likely errors are:

            - **352**: The supplied client response message is not a registration, it''s an authentication

            - **353**: The provided challenge is not the same as the challenge signed in the assertion

            - **354**: The origin in the client response is not in the restricted origins list

            - **356**: Token binding in the client response does not match the expected value

            - **356**: Token binding status missing from client response

            - **382**: The origin in the client response does not start with https

            - **383**: The origin in the client response does not match the relying party ID

            - **388**: Session data was provided but session management for this registration is configured as internal

            - **389**: Maximum number of passkeys exceeded for this user

            - **395**: Operation success/failure response data not provided

            - **396**: Passkey registration failed on the client

            - **399**: Passkey registration was cancelled on the client

            - **401**: The supplied user handle does not match the existing user handle for this user.

            - **402**: Passkey registration timed out on the client

            - **501**: When registration was requested neither a user object nor an external user ID was supplied therefore a user can''t be found or created to associate with this passkey registration

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **235**: Passkey relying party ID not found

            - **233**: Passkey registration policy not found

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure to be returned to the client to finalise registration.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completePasskeyRegistrationWithSessionId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
