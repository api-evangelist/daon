openapi: 3.2.0
info:
  title: Daon Userdata Controller API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged userdata-controller across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: userdata-controller
paths:
  /api/userdata-server/processDefinitions/{processDefnId}/processInstances/{processInstanceId}/userdata/checks:
    get:
      tags:
      - userdata-controller
      summary: Get Checks
      description: 'Get Checks for the Process Instance. Optionally filter by key


        API Permissions: `TNT#{tenantid}#UserDataServer:getChecksByKey`'
      operationId: getChecksByKey
      parameters:
      - name: processDefnId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: key
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
              example:
                visualIntegrity:
                  id: visualIntegrity
                  nested:
                    doc1:
                      id: doc1
                      nested:
                        back:
                          id: back
                          nested:
                            documentScreenRep:
                              id: documentScreenRep
                              outcome: PASS
                              metaData: {}
                            documentColorCopy:
                              id: documentColorCopy
                              outcome: PASS
                              metaData: {}
                            documentQuality:
                              id: documentQuality
                              outcome: PASS
                              metaData: {}
                        front:
                          id: front
                          nested:
                            documentPhotoSub:
                              id: documentPhotoSub
                              outcome: PASS
                              metaData: {}
                            documentScreenRep:
                              id: documentScreenRep
                              outcome: PASS
                              metaData: {}
                            documentColorCopy:
                              id: documentColorCopy
                              outcome: PASS
                              metaData: {}
                            documentQuality:
                              id: documentQuality
                              outcome: PASS
                              metaData: {}
                            documentBW:
                              id: documentBW
                              outcome: PASS
                              metaData: {}
                watchlistResult:
                  id: watchlistResult
                  nested:
                    face1:
                      id: face1
                      outcome: PASS
                      metaData: {}
                faceQuality:
                  id: faceQuality
                  nested:
                    face1:
                      id: face1
                      outcome: PASS
                      metaData: {}
                documentProcessing:
                  id: documentProcessing
                  nested:
                    doc1:
                      id: doc1
                      outcome: PASS
                      metaData: {}
                acceptableDocument:
                  id: acceptableDocument
                  nested:
                    doc1:
                      id: doc1
                      outcome: PASS
                      metaData: {}
                doc2FaceMatch:
                  id: doc2FaceMatch
                  nested:
                    face1:
                      id: face1
                      nested:
                        doc1:
                          id: doc1
                          nested:
                            front:
                              id: front
                              nested:
                                visual:
                                  id: visual
                                  nested:
                                    PORTRAIT:
                                      id: PORTRAIT
                                      outcome: PASS
                                      metaData: {}
                faceLiveness:
                  id: faceLiveness
                  nested:
                    face1:
                      id: face1
                      outcome: PASS
                      metaData: {}
                cloudFunctions:
                  id: cloudFunctions
                  nested:
                    CF1305:
                      id: CF1305
                      outcome: PASS
                      metaData: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/UserDataSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthorizationSkyError'
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenantid}#UserDataServer:getChecksByKey
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/userdata-server/processDefinitions/{processDefnId}/processInstances/{processInstanceId}/getdata:
    get:
      tags:
      - userdata-controller
      summary: Get Image
      description: 'Get base64 encoded representation of user data such as a document or face image.


        API Permissions: `TNT#{tenantid}#UserDataServer:getProcessInstanceImages`'
      operationId: getProcessInstanceImages
      parameters:
      - name: processDefnId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: path
        in: query
        description: The path to the user data. For example, a captured document image.
        required: true
        style: form
        explode: true
        schema:
          type: string
          description: The path to the user data. For example, a captured document image.
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Data'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/UserDataSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthorizationSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#UserDataServer:getProcessInstanceImages
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/userdata-server/processDefinitions/{processDefnId}/processInstances/{processInstanceId}/userdata:
    get:
      tags:
      - userdata-controller
      summary: Get User Data
      description: 'Get the Process Instance information as User Data.


        API Permissions: `TNT#{tenantid}#UserDataServer:getProcessInstanceUserData`'
      operationId: getProcessInstanceUserData
      parameters:
      - name: processDefnId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: optimized
        in: query
        description: Set to true to get an optimized response that excludes large data, such as images. Defaults to false.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          description: Set to true to get an optimized response that excludes large data, such as images. Defaults to false.
      - name: includeKeyedAdditionalDocs
        in: query
        description: 'When true, include keyed additional documents in the response of unoptimized call. When false, exclude keyed additional documents. If not provided, the default behavior depends on the ''optimized'' flag. Note: the combination optimized=true and includeKeyedAdditionalDocs=false is not supported and will result in a requestParametersNotValid error.'
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          description: 'When true, include keyed additional documents in the response of unoptimized call. When false, exclude keyed additional documents. If not provided, the default behavior depends on the ''optimized'' flag. Note: the combination optimized=true and includeKeyedAdditionalDocs=false is not supported and will result in a requestParametersNotValid error.'
      - name: includeInitParams
        in: query
        description: When true, include the merged initialization parameters that were passed when the process instance was created. Defaults to false.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          description: When true, include the merged initialization parameters that were passed when the process instance was created. Defaults to false.
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/UserDataSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthorizationSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#UserDataServer:getProcessInstanceUserData
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/userdata-server/processDefinitions/{processDefnId}/processInstances/{processInstanceId}/userdataarchive:
    post:
      tags:
      - userdata-controller
      summary: Get Summary Archive
      description: 'Get Summary Archive. This file contains PII information - it is the responsibility of the consumer of the API to provide the apprioprate protections for the data.


        API Permissions: `TNT#{tenantid}#UserDataServer:getProcessInstanceUserDataArchive`'
      operationId: getProcessInstanceUserDataArchive
      parameters:
      - name: processDefnId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveConfig'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StreamingResponseBody'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/UserDataSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthorizationSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#UserDataServer:getProcessInstanceUserDataArchive
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
components:
  schemas:
    ProductRawDeviceAttributes:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RawDeviceAttribute'
          description: 'It includes 35+ raw browser identification attributes to provide Fingerprint users with even more information than our standard visitor ID provides. This enables Fingerprint users to not have to run our open-source product in conjunction with Fingerprint Pro Plus and Enterprise to get those additional attributes. Warning: The raw signals data can change at any moment as we improve the product. We cannot guarantee the internal shape of raw device attributes to be stable, so typical semantic versioning rules do not apply here. Use this data with caution without assuming a specific structure beyond the generic type provided here. '
        error:
          $ref: '#/components/schemas/Error'
    IPInfoV6:
      type: object
      properties:
        address:
          type: string
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        asn:
          $ref: '#/components/schemas/IPInfoASN'
        datacenter:
          $ref: '#/components/schemas/IPInfoDataCenter'
      required:
      - address
      - geolocation
    IdentificationConfidence:
      type: object
      properties:
        score:
          type: number
          format: double
          description: The confidence score is a floating-point number between 0 and 1 that represents the probability of accurate identification.
        revision:
          type: string
          description: The revision name of the method used to calculate the Confidence score. This field is only present for customers who opted in to an alternative calculation method.
        comment:
          type: string
      required:
      - score
    UserDataQueryResponseAlgorithmDto:
      type: object
      description: Algorithm configuration for fuzzy matching
      properties:
        type:
          type: string
          description: Type of algorithm used
          example: LEVENSHTEIN_DISTANCE
        parameters:
          $ref: '#/components/schemas/UserDataQueryResponseParametersDto'
          description: Algorithm-specific parameters
    ProductFactoryReset:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FactoryReset'
        error:
          $ref: '#/components/schemas/Error'
    TrendQueryDto:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        documentType:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        trendGroup:
          type: string
        region:
          type: string
        normalize:
          type: boolean
    UserDataVisitorIdTrendRecordDto:
      allOf:
      - $ref: '#/components/schemas/UserDataAbstractTrendRecordDto'
      description: Trend record for visitor ID trends, representing occurrences of specific visitor IDs in user data
    ProductIdentification:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Identification'
        error:
          $ref: '#/components/schemas/Error'
    IPv4AddressTrendCard:
      allOf:
      - $ref: '#/components/schemas/TrendCheckCard'
      - type: object
        properties:
          ipAddress:
            type: string
            description: The IPv4 address that was searched against the trend records.
            example: 192.168.1.100
      description: Watchlist check result for IPv4 address searches. Contains the IPv4 address that was searched in the watchlist.
      required:
      - checkOutcome
      - ipAddress
      - recordCount
      - trendGroup
      - trendType
    StreamingResponseBody: {}
    ProductEmulator:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Emulator'
        error:
          $ref: '#/components/schemas/Error'
    ProductVPN:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/VPN'
        error:
          $ref: '#/components/schemas/Error'
    IdentificationSeenAt:
      type: object
      properties:
        global:
          type: string
          format: date-time
        subscription:
          type: string
          format: date-time
      required:
      - global
      - subscription
    RawDeviceAttribute:
      type: object
      properties:
        value: {}
        error:
          $ref: '#/components/schemas/RawDeviceAttributeError'
    CloudFunctions:
      type: object
      properties:
        reports:
          $ref: '#/components/schemas/AbstractReports'
    PrivacySettings:
      type: object
      properties:
        result:
          type: boolean
          description: '`true` if the request is from a privacy aware browser (e.g. Tor) or from a browser in which fingerprinting is blocked. Otherwise `false`. '
      required:
      - result
    UserDataDocumentNumberTrendRecordDto:
      allOf:
      - $ref: '#/components/schemas/UserDataAbstractTrendRecordDto'
      - type: object
        properties:
          documentType:
            type: string
      description: Trend record for document number trends, including document type information
    PhoneNumberTrendCard:
      allOf:
      - $ref: '#/components/schemas/TrendCheckCard'
      - type: object
        properties:
          phoneNumber:
            type: string
            description: The phone number that was searched against the trend records.
            example: '+353875547894'
      description: Phone number trend check result. Contains the phone number that was searched against trend records.
      required:
      - checkOutcome
      - phoneNumber
      - recordCount
      - trendGroup
      - trendType
    Data:
      type: object
      properties:
        contentType:
          type: string
        data:
          type: string
          format: binary
      required:
      - data
    UserDataLinkDto:
      type: object
      description: Navigation link to a related resource
      properties:
        href:
          type: string
          description: URL to the related resource
          example: /api/watchlist-manager/watchlists/{watchlistId}/entries/{entryId}
    UserDataAbstractTrendRecordDto:
      type: object
      description: Base class for trend record DTOs with common fields for all trend types
      discriminator:
        propertyName: type
      properties:
        id:
          type: string
        type:
          type: string
        value:
          type: string
        recordedDtm:
          type: string
          format: date-time
        processInfo:
          $ref: '#/components/schemas/ProcessInfo'
        trendGroup:
          type: string
        expiresAfterDays:
          type: integer
          format: int32
        expiresAfter:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: {}
        get_links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserDataLinkDto'
          description: 'Navigation links for this trend record. Example relation: self -> /trends/{id}'
    WatchlistMemberCandidate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        score:
          type: number
          format: double
    Incognito:
      type: object
      properties:
        result:
          type: boolean
          description: '`true` if we detected incognito mode used in the browser, `false` otherwise. '
      required:
      - result
    Identification:
      type: object
      properties:
        visitorId:
          type: string
          description: String of 20 characters that uniquely identifies the visitor's browser or mobile device.
        requestId:
          type: string
          description: Unique identifier of the user's request.
        browserDetails:
          $ref: '#/components/schemas/BrowserDetails'
        incognito:
          type: boolean
          description: Flag if user used incognito session.
        ip:
          type: string
          description: IP address of the requesting browser or bot.
        ipLocation:
          $ref: '#/components/schemas/DeprecatedGeolocation'
          deprecated: true
        linkedId:
          type: string
          description: A customer-provided id that was sent with the request.
        suspect:
          type: boolean
          description: Field is `true` if you have previously set the `suspect` flag for this event using the [Server API Update event endpoint](https://dev.fingerprint.com/reference/updateevent).
        timestamp:
          type: integer
          format: int64
          description: Timestamp of the event with millisecond precision in Unix time.
        time:
          type: string
          format: date-time
          description: Time expressed according to ISO 8601 in UTC format, when the request from the JS agent was made. We recommend to treat requests that are older than 2 minutes as malicious. Otherwise, request replay attacks are possible.
        url:
          type: string
          description: Page URL from which the request was sent.
        tag:
          type: object
          additionalProperties: {}
          description: A customer-provided value or an object that was sent with identification request.
        confidence:
          $ref: '#/components/schemas/IdentificationConfidence'
        visitorFound:
          type: boolean
          description: Attribute represents if a visitor had been identified before.
        firstSeenAt:
          $ref: '#/components/schemas/IdentificationSeenAt'
        lastSeenAt:
          $ref: '#/components/schemas/IdentificationSeenAt'
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RawDeviceAttribute'
          description: 'It includes 35+ raw browser identification attributes to provide Fingerprint users with even more information than our standard visitor ID provides. This enables Fingerprint users to not have to run our open-source product in conjunction with Fingerprint Pro Plus and Enterprise to get those additional attributes. Warning: The raw signals data can change at any moment as we improve the product. We cannot guarantee the internal shape of raw device attributes to be stable, so typical semantic versioning rules do not apply here. Use this data with caution without assuming a specific structure beyond the generic type provided here. '
        replayed:
          type: boolean
          description: '`true` if we determined that this payload was replayed, `false` otherwise. '
        sdk:
          $ref: '#/components/schemas/SDK'
        environmentId:
          type: string
          description: Environment ID associated with the event
      required:
      - browserDetails
      - firstSeenAt
      - incognito
      - ip
      - lastSeenAt
      - replayed
      - requestId
      - tag
      - time
      - timestamp
      - url
      - visitorFound
      - visitorId
    UserDataSliceAbstractTrendRecordDto:
      type: object
      description: Paginated slice of trend records, containing metadata about pagination and sorting
      properties:
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
        content:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/UserDataDocumentNumberTrendRecordDto'
            - $ref: '#/components/schemas/UserDataEmailTrendRecordDto'
            - $ref: '#/components/schemas/UserDataIpv4AddressTrendRecordDto'
            - $ref: '#/components/schemas/UserDataPhoneNumberTrendRecordDto'
            - $ref: '#/components/schemas/UserDataVisitorIdTrendRecordDto'
        sort:
          $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
    IPInfoASN:
      type: object
      properties:
        asn:
          type: string
        name:
          type: string
        network:
          type: string
      required:
      - asn
      - name
      - network
    CallAction:
      type: object
      properties:
        operationId:
          type: string
        executionKey:
          type: string
        startDtm:
          type: string
          format: date-time
        endDtm:
          type: string
          format: date-time
        completeReason:
          type: string
        errorCode:
          type: integer
          format: int32
        errorMessage:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - RequestCannotBeParsed
          - TokenRequired
          - TokenNotFound
          - SubscriptionNotActive
          - WrongRegion
          - FeatureNotEnabled
          - RequestNotFound
          - VisitorNotFound
          - TooManyRequests
          - 429 Too Many Requests
          - StateNotReady
          - Failed
        message:
          type: string
      required:
      - code
      - message
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    DeveloperTools:
      type: object
      properties:
        result:
          type: boolean
          description: '`true` if the browser is Chrome with DevTools open or Firefox with Developer Tools open, `false` otherwise. '
      required:
      - result
    UserDataPhoneNumberTrendRecordDto:
      allOf:
      - $ref: '#/components/schemas/UserDataAbstractTrendRecordDto'
      - type: object
        properties:
          region:
            type: string
      description: Trend record for phone number trends, representing occurrences of specific phone numbers in user data, with optional region information
    Call:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: string
        audioSourceName:
          type: string
        audioFileHash:
          type: string
        status:
          type: string
        errorCode:
          type: integer
          format: int32
        errorMessage:
          type: string
        metadata:
          type: object
          additionalProperties: {}
        callActions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CallAction'
    VisitorIDWatchlistCard:
      allOf:
      - $ref: '#/components/schemas/WatchlistCard'
      - type: object
        properties:
          visitorId:
            type: string
