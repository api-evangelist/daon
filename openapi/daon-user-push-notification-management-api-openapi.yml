components:
  schemas:
    SendPushNotificationResponse:
      type: object
      description: The response from the API for sending a push notification to a user.
      properties:
        trustXPushResponseParams:
          $ref: '#/components/schemas/TrustXPushResponseParams'
    PushNotificationSummary:
      type: object
      description: Summary information about a push notification sent to a user.
      properties:
        id:
          type: string
          description: 'Push notification record identifier.

            The base-64 encoding of the key compressed using the zlib deflate algorithm.'
        notificationType:
          type: string
          description: The type of push notification
          enum:
          - TRUSTX
          - GENERIC
        notificationSubtype:
          type: string
          description: The subtype of push notification
          enum:
          - APPKEY
        notificationStatus:
          type: string
          description: The status of the push notification, whether it sent successfully or failed
          enum:
          - SUCCESS
          - FAIL
        processInstanceId:
          type: string
          description: The process instance identifier associated with a TrustX push notification
        processInstanceStatus:
          type: string
          description: The status of the process instance associated with a TrustX push notification if has its status monitored
          enum:
          - PENDING
          - IN_PROGRESS
          - TIMED_OUT
          - COMPLETE_SUCCESS
          - COMPLETE_FAILED
        rpId:
          type: string
          description: The relying party ID associated with the push notification
        deviceId:
          type: string
          description: The device ID to which the push notification was sent
        deviceName:
          type: string
          description: The name of the device to which the push notification was sent
        deviceModel:
          type: string
          description: The model of the device to which the push notification was sent
        osType:
          type: string
          description: The operating system type of the device to which the push notification was sent
        createdDtm:
          type: string
          format: date-time
          description: The created date time of the push notification record
        content:
          $ref: '#/components/schemas/PushNotificationContent'
          description: Optional content of the push notification. Returned only if specifically requested using the includeContent parameter.
    TrustXPushRequestParams:
      type: object
      description: Information required to create a TrustX push notification which is managed using a TrustX process.
      properties:
        parentTrustXProcess:
          $ref: '#/components/schemas/ParentTrustXProcess'
          description: The mandatory TrustX process from which the push notification is requested.
        childTrustXProcess:
          $ref: '#/components/schemas/ChildTrustXProcess'
          description: The mandatory TrustX process which is executed as the push notification action.
      required:
      - childTrustXProcess
      - parentTrustXProcess
    PushNotificationContent:
      type: object
      description: Contents of a push notification.
      properties:
        title:
          type: string
          description: A push notification title.
        message:
          type: string
          description: A push notification message.
        titleLocKey:
          type: string
          description: Optional key for a localisable push notification title.
        titleLocArgs:
          type: array
          description: Optional arguments for a localisable push notification title.
          items:
            type: string
        messageLocKey:
          type: string
          description: Optional key for a localisable push notification message.
        messageLocArgs:
          type: array
          description: Optional arguments for a localisable push notification message.
          items:
            type: string
        customProperties:
          type: object
          additionalProperties:
            type: object
          description: Optional custom properties to be included with the push notification.
    ChildTrustXProcess:
      type: object
      description: Information about the TrustX process which is executed as the push notification action.
      properties:
        processDefnName:
          type: string
          description: Optional. The TrustX process definition name. Either name and version or a tag must be provided.
        processDefnVersion:
          type: integer
          format: int32
          description: Optional. The TrustX process definition version. Either name and version or a tag must be provided.
        processDefnTag:
          type: string
          description: Optional. The TrustX process definition tag. Either name and version or a tag must be provided.
        monitorStatus:
          type: boolean
          description: 'If present and true then the status of the push notification TrustX process will be monitored.

            A polling URL will be generated which facilitates polling of the process status to wait for its completion.'
        initParams:
          type: object
          additionalProperties:
            type: object
          description: Optional parameters to be supplied to the TrustX process when it is started.
    PushNotificationRecord:
      type: object
      description: A record of a push notification sent to a user's device application.
      properties:
        id:
          type: string
          description: Unique identifier for the push notification record.
          minLength: 1
        tenantId:
          type: string
