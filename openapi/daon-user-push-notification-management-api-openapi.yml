openapi: 3.2.0
info:
  title: Daon User Push Notification Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Push Notification Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Push Notification Management
paths:
  /api/identity-store/stores/{storeName}/users/{userId}/pushNotifications/relyingParties/{rpId}:
    post:
      tags:
      - User Push Notification Management
      summary: Send push notification to user devices with registered appkeys for the…
      description: 'The push notification is sent asynchronously. Either a generic or a TrustX push notification can be requested. A TrustX push notification requires a TrustX process to be created which may have its status monitored so it can be polled and waited on.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:sendPushNotification` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:sendPushNotification`'
      operationId: sendPushNotification
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose push notification policy will be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: TX_PII
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: A push notification request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPushNotificationRequest'
        required: true
      responses:
        '200':
          description: Push notification request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPushNotificationResponse'
        '400':
          description: 'An error occurred. Possible error codes

            - **2800**: No destinations are registered for this user

            - **2801**: No valid destinations are available for this user

            - **2802**: Failed to create a process token for the push notification TrustX process

            - **2806**: Push notification policy is not configured to support all of the push notification destinations

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2701**: Push notification policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:sendPushNotification
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userExtId}/pushNotifications/relyingParties/{rpId}/ext:
    post:
      tags:
      - User Push Notification Management
      summary: Send push notification to user devices with registered appkeys for the…
      description: 'The push notification is sent asynchronously. Either a generic or a TrustX push notification can be requested. A TrustX push notification requires a TrustX process to be created which may have its status monitored so it can be polled and waited on.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:sendPushNotificationByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:sendPushNotificationByExtUserId`'
      operationId: sendPushNotificationByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose push notification policy will be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: TX_PII
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: A push notification request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPushNotificationRequest'
        required: true
      responses:
        '200':
          description: Push notification request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPushNotificationResponse'
        '400':
          description: 'An error occurred. Possible error codes

            - **2800**: No destinations are registered for this user

            - **2801**: No valid destinations are available for this user

            - **2802**: Failed to create a process token for the push notification TrustX process

            - **2806**: Push notification policy is not configured to support all of the push notification destinations

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2701**: Push notification policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:sendPushNotificationByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/pushNotifications:
    get:
      tags:
      - User Push Notification Management
      summary: List active push notifications grouped by relying party ID and device ID for…
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserPushNotifications` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserPushNotifications`'
      operationId: listUserPushNotifications
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: includeContent
        in: query
        description: 'Whether to include the push notification content in the response.


          **NOTE** Use with caution as this will slow the API down. Recommended for use with appropriate filtering.'
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: rpId
        in: query
        description: Optional filter by relying party ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: deviceId
        in: query
        description: Optional filter by device ID
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: Optional filter by push notification type
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - TRUSTX
          - GENERIC
      - name: notificationStatus
        in: query
        description: Optional filter by push notification status
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: Status of a push notification send operation
          enum:
          - SUCCESS
          - FAIL
      - name: processInstanceStatus
        in: query
        description: Optional filter by process instance status, only relevant for monitored TrustX push notifications
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - TIMED_OUT
          - COMPLETE_SUCCESS
          - COMPLETE_FAILED
      responses:
        '200':
          description: Push notifications listed successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: '#/components/schemas/PushNotificationSummary'
        '400':
          description: 'An error occurred.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUserPushNotifications
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userExtId}/pushNotifications/{id}/ext:
    get:
      tags:
      - User Push Notification Management
      summary: Get a push notification record for a user.
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getUserPushNotificationRecordByExtUserID` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getUserPushNotificationRecordByExtUserID`'
      operationId: getUserPushNotificationRecordByExtUserID
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the push notification record returned when listing push notifications for the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Push notification record retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushNotificationRecord'
        '400':
          description: 'An error occurred. Possible error codes

            - **2803**: Invalid record ID value - not zlib compressed

            - **2804**: Badly formatted record ID value

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2805**: Push notification record not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUserPushNotificationRecordByExtUserID
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
