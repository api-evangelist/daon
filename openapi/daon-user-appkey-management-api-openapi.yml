  /api/identity-store/stores/{storeName}/users/{extUserId}/appkeys/relyingParties/{rpId}/registrations/keyIds/{keyId}/ext:
    delete:
      tags:
      - User Appkey Management
      summary: Delete registered appkeys from a device given an appkey's key ID from the…
      description: 'This API supports an appkey deregistration flow in which a key ID of an appkey to delete is sent from the device client. The appkey is deleted on the server and a deregistration request message is provided which is sent to the client to delete the key.


        The default behaviour is to delete the specified appkey from the server and generate a deregistration request to delete than single key from the client. A `mode` parameter may be supplied to delete:

        - all appkeys of the same type on the same device as the specified appkey

        - all appkeys for the same device as the specified appkey

        - all appkeys registered for the same user as the specified appkey


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deregisterUserAppkeyByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deregisterUserAppkeyByExtUserId`'
      operationId: deregisterUserAppkeyByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extUserId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose appkey will be deregistered
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: keyId
        in: path
        description: Key ID of the appkey credential (supplied by the device)
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: mode
        in: query
        description: 'Deregistration mode: default is `SINGLE_KEY`'
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: SINGLE_KEY
          description: "Appkey deregistration mode: \n- **SINGLE_KEY**: delete just the specified appkey.\n- **BY_AAID_AND_DEVICE_ID**: delete all appkeys of the same type on the same device as the specified appkey.\n- **ALL_BY_DEVICE_ID**: delete all appkeys for the same device as the specified appkey.\n- **ALL**: delete all appkeys registered for the same user as the specified appkey.\n"
          enum:
          - SINGLE_KEY
          - BY_AAID_AND_DEVICE_ID
          - ALL_BY_DEVICE_ID
          - ALL
      responses:
        '200':
          description: User appkey(s) deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregistrationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1068**: The specified appkey is not registered to the specified user

            - **1100**: The specified appkey does not have a registered device ID so the requested appkeys belonging to the same device cannot be deleted.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **1058**: Appkey not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deregisterUserAppkeyByExtUserId
