  /api/identity-store/stores/{storeName}/appkeys/registrations:
    post:
      tags:
      - User Appkey Management
      summary: Complete an appkey registration for an externally managed session
      description: 'This API is used to complete an appkey registration where the appkey configuration `sessionManagementExternal` parameter is set to `true` which means that the session data object was returned when the registration was requested and must be provided back to the server along with the response from the client.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completeAppkeyRegistrationWithSession` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completeAppkeyRegistrationWithSession`'
      operationId: completeAppkeyRegistrationWithSession
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The client registration response message and session data object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppkeyRegistrationResponseHolder'
        required: true
      responses:
        '200':
          description: Appkey registration completed successfully
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure to be returned to the client to finalise registration.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAppkeyResult'
        '400':
          description: 'An error occurred either on the server or the client. Not all the error codes are listed here as there are many and a lot of them are unlikely to occur when integrating with a valid appkey client. Some of the more likely errors are:

            - **501**: When registration was requested neither a user object nor an external user ID was supplied therefore a user can''t be found or created to associate with this appkey registration

            - **1009**: Session data not provided

            - **1010**: Session data is missing registration policy name

            - **1011**: Session data is missing the challenge

            - **1012**: Session data is missing the relying party ID

            - **1017**: The supplied client response message is not a registration, it''s an authentication for example

            - **1026**: The application on the client device is not registered in the trusted facets list of the appkey policy

            - **1029**: The session challenge does not match the challenge in the client response

            - **1035**: The appkey type is not supported- **1050**: The registered appkeys do not satisfy the registration policy- **1055**: Session data is missing the policy

            - **1094**: Malformed registration response message from the client

            - **1095**: Client response message contains no registration responses

            - **1096**: Client response message contains multiple registration responses

            - **1098**: Maximum number of appkeys exceeded for this user

            - **1115**: Operation success/failure response data not provided

            - **1116**: Appkey registration failed on the client

            - **1121**: Appkey registration cancelled on the client

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure to be returned to the client to finalise registration.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **1000**: Appkey relying party not found

            - **1001**: Appkey registration policy not found

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure to be returned to the client to finalise registration.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
