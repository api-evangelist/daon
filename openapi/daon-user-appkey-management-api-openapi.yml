openapi: 3.2.0
info:
  title: Daon User Appkey Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Appkey Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Appkey Management
paths:
  /api/identity-store/stores/{storeName}/users/{userId}/appkeys/relyingParties/{rpId}/registrations/keyIds/{keyId}:
    delete:
      tags:
      - User Appkey Management
      summary: Delete registered appkeys from a device given an appkey's key ID from the…
      description: 'This API supports an appkey deregistration flow in which a key ID of an appkey to delete is sent from the device client. The appkey is deleted on the server and a deregistration request message is provided which is sent to the client to delete the key.


        The default behaviour is to delete the specified appkey from the server and generate a deregistration request to delete than single key from the client. A `mode` parameter may be supplied to delete:

        - all appkeys of the same type on the same device as the specified appkey

        - all appkeys for the same device as the specified appkey

        - all appkeys registered for the same user as the specified appkey


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deregisterUserAppkeyByUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deregisterUserAppkeyByUserId`'
      operationId: deregisterUserAppkeyByUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose appkey will be deregistered
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: keyId
        in: path
        description: Key ID of the appkey credential (supplied by the device)
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: mode
        in: query
        description: 'Deregistration mode: default is `SINGLE_KEY`'
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: SINGLE_KEY
          description: "Appkey deregistration mode: \n- **SINGLE_KEY**: delete just the specified appkey.\n- **BY_AAID_AND_DEVICE_ID**: delete all appkeys of the same type on the same device as the specified appkey.\n- **ALL_BY_DEVICE_ID**: delete all appkeys for the same device as the specified appkey.\n- **ALL**: delete all appkeys registered for the same user as the specified appkey.\n"
          enum:
          - SINGLE_KEY
          - BY_AAID_AND_DEVICE_ID
          - ALL_BY_DEVICE_ID
          - ALL
      responses:
        '200':
          description: User appkey(s) deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregistrationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1068**: The specified appkey is not registered to the specified user

            - **1100**: The specified appkey does not have a registered device ID so the requested appkeys belonging to the same device cannot be deleted.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **1058**: Appkey not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deregisterUserAppkeyByUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/appkeys/relyingParties/{rpId}/deregistrations:
    post:
      tags:
      - User Appkey Management
      summary: Delete registered appkeys for a user (identified by internal ID) and create a…
      description: 'This API supports an TrustX process deregistration flow where the device ID and deregistration options (AAIDs, types to delete) are specified. The appkeys are deleted on the server and a deregistration request message is provided which is sent to the client to delete the keys.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deregisterUserAppkeys` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deregisterUserAppkeys`'
      operationId: deregisterUserAppkeys
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose appkey will be deregistered
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeregistrationParameters'
        required: true
      responses:
        '200':
          description: User appkey(s) deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregistrationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1122**: Parameters not supplied

            - **1123**: AAID options are empty in the supplied parameters.

            - **1124**: Appkey type options are empty in the supplied parameters.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **1000**: Appkey relying party ID not found

            - **1125**: No registered appkeys found for this device

            - **1126**: No registered appkeys found for this device and RP ID

            - **1127**: No registered appkeys found for this device and AAID

            - **1128**: No registered appkeys found for this device and AAIDs

            - **1129**: No registered appkeys found for this device and appkey type

            - **1130**: No registered appkeys found for this device and appkey types

            - **1132**: No registered appkeys found for this relying party

            - **1133**: No registered appkeys found for this relying party and AAID

            - **1134**: No registered appkeys found for this relying party and AAIDs

            - **1135**: No registered appkeys found for this relying party and appkey type

            - **1136**: No registered appkeys found for this relying party and appkey types

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deregisterUserAppkeys
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/appkeys/authentications:
    post:
      tags:
      - User Appkey Management
      summary: Complete an appkey authentication for an externally managed session
      description: 'This API is used to complete an appkey authentication where the appkey configuration `sessionManagementExternal` parameter is set to `true` which means that the session data object was returned when the authentication was requested and must be provided back to the server along with the response from the client.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSession` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSession`'
      operationId: completeAppkeyAuthenticationWithSession
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The client authentication response message and session data object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppkeyAuthResponseHolder'
        required: true
      responses:
        '200':
          description: Appkey authentication completed successfully
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateAppkeyResult'
        '400':
          description: 'An error occurred either on the server or the client. Not all the error codes are listed here as there are many and a lot of them are unlikely to occur when integrating a validated appkey client.


            **NOTE** For convenience the updated user object is returned when there is an authentication error because it may contain updated information about the user lock state.


            Some of the more likely errors are:

            - **502**: The user associated with this authentication is not active- **1009**: Session data not provided

            - **1011**: Session data is missing the challenge

            - **1012**: Session data is missing the relying party ID

            - **1017**: The supplied client response message is not an authentication, it''s a registration for example

            - **1026**: The application on the client device is not registered in the trusted facets list of the appkey policy

            - **1029**: The session challenge does not match the challenge in the client response

            - **1035**: The appkey type is not supported- **1055**: Session data is missing the policy

            - **1056**: Session data is missing authentication policy name

            - **1058**: No appkey was found which matched the appkey key ID supplied in the authentication assertion

            - **1059**: The appkey referenced in the authentication assertion was not registered to the expected user

            - **1060**: The appkey referenced in the authentication assertion is not active

            - **1061**: Potential appkey clone detected, the signature count is lower than expected.

            - **1090**: The single-shot challenge timestamp is outside the valid time window

            - **1091**: Malformed authentication response message from the client

            - **1092**: Client response message contains no authentication responses

            - **1093**: Client response message contains multiple authentication responses

            - **1102**: Malformed authentication failure response message from the client

            - **1104**: The authentication failed on the client

            - **1105**: The authentication was cancelled by the client

            - **1115**: Operation success/failure response data not provided

            - **2100**: The user is locked. Authentication cannot proceed.

            - **2101**: The user appkey modality is locked. Authentication cannot proceed.

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
              example:
                code: '401'
                message: Authentication failed
                user:
                  id: EEWOIHIJ3CJYXAKIRGAMEIUJGU
                  status: ACTIVE
                  extId: '12345678'
                  locale:
                    language: en
                    country: US
                  timezone: Europe/London
                  firstName: John
                  lastName: Does
                  email: jd@mail.com
                  dateOfBirth: {}
                  nationalities:
                  - US
                  locks:
                    lockCounter: 1
                  createdDtm: {}
                  lastUpdatedDtm: {}
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **1000**: Appkey relying party not found

            - **1002**: Appkey authentication policy not found

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSession
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
