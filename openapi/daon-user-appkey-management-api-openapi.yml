  ? /api/identity-store/stores/{storeName}/users/{userExtId}/appkeys/relyingParties/{rpId}/authentications/{authPolicyName}/ext
  : post:
      tags:
      - User Appkey Management
      summary: Create an appkey authentication request for a known user identified by external…
      description: 'The authentication request returned from the server must be supplied to the client to initiate a user appkey authentication. The response from the client is returned to the server to complete server authentication.


        Session data is shared between the authentication request and completion API calls. If in the appkey configuration `sessionManagementExternal` is set to `false` then these session data are managed internally by the server and a session ID is returned by this API which must be provided when the authentication is completed. Otherwise if `sessionManagementExternal` is `true` the session data itself is returned by the API and must be provided when the authentication is completed. If session data is managed internally it is stored temporarily for the duration configured as `sessionDuration`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createAppkeyAuthenticationForUserByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createAppkeyAuthenticationForUserByExtId`'
      operationId: createAppkeyAuthenticationForUserByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rpId
        in: path
        description: The ID of the relying party whose appkey authentication configuration will be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: authPolicyName
        in: path
        description: The name of the appkey authentication policy for the relying party
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Additional authentication parameters. May be empty.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendedAppkeyAuthenticationParameters'
        required: true
      responses:
        '201':
          description: Appkey authentication request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppkeyAuthRequestHolder'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1004**: The appkey policy does not contain accepted match criteria

            - **1054**: The provided transaction image could not be read.

            - **10541**: The provided transaction image is not supported or not a valid image.

            - **1139**: None of the appkeys allowed for this authentication support transaction processing.

            - **2100**: The user is locked. Authentication cannot proceed.

            - **2101**: The user appkey modality is locked. Authentication cannot proceed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **1000**: Appkey relying party ID not found

            - **1002**: Appkey authentication policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createAppkeyAuthenticationForUserByExtId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/appkeys/relyingParties/{rpId}/authentications/{authPolicyName}:
    post:
      tags:
      - User Appkey Management
      summary: Create an anonymous appkey authentication request (where a user is not…
      description: 'The authentication request returned from the server must be supplied to the client to initiate a user appkey authentication. The response from the client is returned to the server to complete server authentication.


        Session data is shared between the authentication request and completion API calls. If in the appkey configuration `sessionManagementExternal` is set to `false` then these session data are managed internally by the server and a session ID is returned by this API which must be provided when the authentication is completed. Otherwise if `sessionManagementExternal` is `true` the session data itself is returned by the API and must be provided when the authentication is completed. If session data is managed internally it is stored temporarily for the duration configured as `sessionDuration`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createAppkeyAuthentication` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createAppkeyAuthentication`'
