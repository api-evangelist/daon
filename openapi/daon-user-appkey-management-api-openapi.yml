  /api/identity-store/stores/{storeName}/appkeys/authentications/sessions/{sessionId}:
    post:
      tags:
      - User Appkey Management
      summary: Complete an appkey authentication for an internally managed session
      description: 'This API is used to complete an appkey authentication where the appkey configuration `sessionManagementExternal` parameter is set to `false` which means that a session ID of an internally managed session was returned when the authentication was requested and must be provided back to the server along with the response from the client.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSessionId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSessionId`'
      operationId: completeAppkeyAuthenticationWithSessionId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: sessionId
        in: path
        description: The session ID returned by the server when the authentication was requested
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The client authentication response message.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAuthenticationResponse'
        required: true
      responses:
        '200':
          description: Appkey authentication completed successfully
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateAppkeyResult'
        '400':
          description: 'An error occurred either on the server or the client. Not all the error codes are listed here as there are many and a lot of them are unlikely to occur when integrating with a validated appkey client.


            **NOTE** For convenience the updated user object is returned when there is an authentication error because it may contain updated information about the user lock state.


            Some of the more likely errors are:

            - **502**: The user associated with this authentication is not active- **1014**: Session data was provided but session management for this authentication is configured as internal

            - **1017**: The supplied client response message is not an authentication, it''s a registration for example

            - **1026**: The application on the client device is not registered in the trusted facets list of the appkey policy

            - **1029**: The session challenge does not match the challenge in the client response

            - **1035**: The appkey type is not supported- **1058**: No appkey was found which matched the appkey key ID supplied in the authentication assertion

            - **1059**: The appkey referenced in the authentication assertion was not registered to the expected user

            - **1060**: The appkey referenced in the authentication assertion is not active

            - **1061**: Potential appkey clone detected, the signature count is lower than expected.

            - **1090**: The single-shot challenge timestamp is outside the valid time window

            - **1091**: Malformed authentication response message from the client

            - **1092**: Client response message contains no authentication responses

            - **1093**: Client response message contains multiple authentication responses

            - **1102**: Malformed authentication failure response message from the client

            - **1104**: The authentication failed on the client

            - **1105**: The authentication was cancelled by the client

            - **1115**: Operation success/failure response data not provided

            - **2100**: The user is locked. Authentication cannot proceed.

            - **2101**: The user appkey modality is locked. Authentication cannot proceed.

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
              example:
                code: '401'
                message: Authentication failed
                user:
                  id: EEWOIHIJ3CJYXAKIRGAMEIUJGU
                  status: ACTIVE
                  extId: '12345678'
                  locale:
                    language: en
                    country: US
                  timezone: Europe/London
                  firstName: John
                  lastName: Does
                  email: jd@mail.com
                  dateOfBirth: {}
                  nationalities:
                  - US
                  locks:
                    lockCounter: 1
                  createdDtm: {}
                  lastUpdatedDtm: {}
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **1000**: Appkey relying party not found

            - **1002**: Appkey authentication policy not found

            - **1052**: Session data for the specified session ID not found.

            '
          headers:
            Uaf-Status-Code:
              description: A server status code indicating success or failure.
              style: simple
              explode: false
              schema:
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completeAppkeyAuthenticationWithSessionId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
