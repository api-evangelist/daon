  /api/identity-store/stores/{storeName}/appkeys/relyingParties/{rpId}/registrations/{regPolicyName}:
    post:
      tags:
      - User Appkey Management
      summary: Create an appkey registration request for a user identified by an optional…
      description: 'The request optionally contains the external ID of the user for whom the registration will be created. If this is not supplied an external ID with a random 32-character alphanumeric ID will be generated by the server and returned in the session data. A user will be created with this ext ID when registration is completed and the appkey will be registered to that user.


        The registration request returned from the server must be supplied to the client on the device to initiate a user appkey registration. The response from the client is returned to the server to complete registration and store the generated appkey in the server.


        Session data is shared between the registration request and completion API calls. If in the appkey configuration `sessionManagementExternal` is set to `false` then these session data are managed internally by the server and a session ID is returned by this API which must be provided when the registration is completed. Otherwise if `sessionManagementExternal` is `true` the session data itself is returned by the API and must be provided when the registration is completed. If session data is managed internally it is stored temporarily for the duration configured as `sessionDuration`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createAppkeyRegistration` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createAppkeyRegistration`'
      operationId: createAppkeyRegistration
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: rpId
        in: path
        description: The ID of the relying party whose appkey registration configuration will be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: regPolicyName
        in: path
        description: The name of the appkey registration policy for the relying party
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Additional registration parameters. May be empty.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendedAppkeyRegistrationParameters'
        required: true
      responses:
        '201':
          description: Appkey registration request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppkeyRegistrationRequestHolder'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1004**: The appkey policy does not contain accepted match criteria

            - **1120**: The user is not in a state to allow appkey registration

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **1000**: Appkey relying party ID not found

            - **1001**: Appkey registration policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createAppkeyRegistration
