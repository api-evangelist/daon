openapi: 3.2.0
info:
  title: Daon Process Tokens API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged Process Tokens across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: Process Tokens
paths:
  /api/process-manager/processTokens/{processTokenId}:
    get:
      tags:
      - Process Tokens
      summary: Get Process Token
      description: 'Get process token for the given ID.


        API Permissions: `TNT#{tenantid}#ProcessManager:getProcessToken`'
      operationId: getProcessToken
      parameters:
      - name: processTokenId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTokenDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:getProcessToken
    put:
      tags:
      - Process Tokens
      summary: Invalidate a process token
      description: 'Invalidate process token given a processTokenId.


        API Permissions: `TNT#{tenantid}#ProcessManager:invalidateProcessToken`'
      operationId: invalidateProcessToken
      parameters:
      - name: processTokenId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTokenDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      deprecated: true
      x-visibility: DEPRECATED
      x-permission: TNT#{tenantid}#ProcessManager:invalidateProcessToken
    delete:
      tags:
      - Process Tokens
      summary: Delete a process token
      description: 'Delete a process token given a processTokenId.


        API Permissions: `TNT#{tenantid}#ProcessManager:deleteProcessToken`'
      operationId: deleteProcessToken
      parameters:
      - name: processTokenId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: BETA
      x-permission: TNT#{tenantid}#ProcessManager:deleteProcessToken
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processTokens:
    get:
      tags:
      - Process Tokens
      summary: List Process Tokens
      description: 'List process tokens given a search criteria.


        API Permissions: `TNT#{tenantid}#ProcessManager:listProcessTokens`'
      operationId: listProcessTokens
      parameters:
      - name: processTokenSearch
        in: query
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/ProcessTokenSearchDto'
      - name: page
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 1
      - name: sort
        in: query
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProcessTokenLight'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:listProcessTokens
    post:
      tags:
      - Process Tokens
      summary: Create a process token
      description: 'Create a process token.


        API Permissions: `TNT#{tenantid}#ProcessManager:addProcessToken`'
      operationId: addProcessToken
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessToken'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessToken'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:addProcessToken
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
components:
  schemas:
    Upload:
      type: object
      properties:
        imageFormat:
          type: string
          description: Image Format
          enum:
          - JPEG
          minLength: 1
          readOnly: true
        captureKey:
          type: string
          description: The image capture key
          readOnly: true
        uploadUrl:
          type: string
          description: The location to which the face image should be uploaded
          readOnly: true
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: The upload headers that must be set when uploading the images
          readOnly: true
      required:
      - imageFormat
    ProcessInstanceParameterConstraint:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        mandatory:
          type: boolean
        minimumLength:
          type: integer
          format: int32
        maximumLength:
          type: integer
          format: int32
        pattern:
          type: string
        default:
          type: string
          description: Default value for the parameter (currently only string values are supported)
          example: string
      required:
      - name
    ProcessTokenLight:
      type: object
      properties:
        createdDtm:
          type: string
          format: date-time
          readOnly: true
        lastUpdatedDtm:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        lastUpdatedBy:
          type: string
          readOnly: true
        id:
          type: string
          readOnly: true
        tenantId:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 50
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        processDefnName:
          type: string
          description: Process Definition Name. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied.
          example: myProcessDefn
          maxLength: 50
          minLength: 0
        processDefnVersion:
          type: integer
          format: int32
          description: Process Definition Version. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied.
          example: 1
        processDefnTag:
          type: string
          description: Process Definition Tag. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied. Using a tag is a more flexible approach - it allows a Process Token to be refer to a newer version of a Process Definition if the tag is moved from one version to another.
          example: myProdTag
        uiUrl:
          type: string
          maxLength: 500
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        type:
          type: string
          enum:
          - UNLIMITED
          - MULTI_USE_COUNT_LIMITED
          - MULTI_USE_TIME_LIMITED
        notBeforeDtm:
          type: string
          format: date-time
        notAfterDtm:
          type: string
          format: date-time
        maxCount:
          type: integer
          format: int32
        counter:
          type: integer
          format: int32
          readOnly: true
        maxProcessDuration:
          type: string
          deprecated: true
          description: This field is deprecated and will be removed in future versions. Deprecated since Aug 2025.
        forTest:
          type: boolean
          deprecated: true
        startProcessAddress:
          type: string
          readOnly: true
      required:
      - name
      - status
      - type
    CreateProcessInstanceDto:
      type: object
      properties:
        externalSources:
          $ref: '#/components/schemas/ExternalSources'
    PageProcessTokenLight:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        number:
          type: integer
          format: int32
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProcessTokenLight'
        empty:
          type: boolean
    AbstractSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    ProcessManagerSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    ExternalSources:
      type: object
      properties:
        faceUploads:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Upload'
          description: External Face Uploads. This is a map based on a face key and the upload.
          readOnly: true
        documentUploads:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DocumentUpload'
          description: External Document Uploads. This is a map based on a doc key and the upload.
          readOnly: true
    DocumentUpload:
      type: object
      properties:
        documentFormat:
          type: string
          description: Document Format
          enum:
          - PDF
          minLength: 1
          readOnly: true
        documentCaptureKey:
          type: string
          description: The document capture key
          readOnly: true
        pageCaptureKey:
          type: string
          description: The document page capture key
          readOnly: true
        uploadUrl:
          type: string
          description: The location to which the document should be uploaded
          readOnly: true
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: The upload headers that must be set when uploading the document
          readOnly: true
      required:
      - documentFormat
    PageableObject:
      type: object
      properties:
        sort:
          $ref: '#/components/schemas/SortObject'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
    Sort:
      type: object
      properties:
        sort:
          type: array
          items:
            type: string
    ProcessTokenDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        processDefnId:
          type: string
          description: Process definition ID that token is created for.
        processDefnName:
          type: string
          description: Process definition name that token is created for. This field is populated only if tag is created based on process definition name and version.
        processDefnVersion:
          type: integer
          format: int32
          description: Process definition version that token is created for. This field is populated only if tag is created based on process definition name and version.
        processDefnTag:
          type: string
          description: Process definition tag that token is created for. This field is populated only if tag is created based on process definition tag itself.
        uiUrl:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        type:
          type: string
          enum:
          - UNLIMITED
          - MULTI_USE_COUNT_LIMITED
          - MULTI_USE_TIME_LIMITED
        notBeforeDtm:
          type: string
          format: date-time
        notAfterDtm:
          type: string
          format: date-time
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUpdatedBy:
          type: string
        maxCount:
          type: integer
          format: int32
        counter:
          type: integer
          format: int32
        maxProcessDuration:
          type: string
          deprecated: true
          description: This field is deprecated and will be removed in future versions. Deprecated since Aug 2025.
        parameters:
          type: object
          additionalProperties: {}
        processInstanceInit:
          $ref: '#/components/schemas/CreateProcessInstanceDto'
    ProcessToken:
      type: object
      properties:
        createdDtm:
          type: string
          format: date-time
          readOnly: true
        lastUpdatedDtm:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        lastUpdatedBy:
          type: string
          readOnly: true
        id:
          type: string
          readOnly: true
        tenantId:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 50
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        processDefnName:
          type: string
          description: Process Definition Name. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied.
          example: myProcessDefn
          maxLength: 50
          minLength: 0
        processDefnVersion:
          type: integer
          format: int32
          description: Process Definition Version. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied.
          example: 1
        processDefnTag:
          type: string
          description: Process Definition Tag. When creating a process token either the Process Definition Tag or the Process Definition Name & Version should be supplied. Using a tag is a more flexible approach - it allows a Process Token to be refer to a newer version of a Process Definition if the tag is moved from one version to another.
          example: myProdTag
        uiUrl:
          type: string
          maxLength: 500
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        type:
          type: string
          enum:
          - UNLIMITED
          - MULTI_USE_COUNT_LIMITED
          - MULTI_USE_TIME_LIMITED
        notBeforeDtm:
          type: string
          format: date-time
        notAfterDtm:
          type: string
          format: date-time
        maxCount:
          type: integer
          format: int32
        counter:
          type: integer
          format: int32
          readOnly: true
        maxProcessDuration:
          type: string
          deprecated: true
          description: This field is deprecated and will be removed in future versions. Deprecated since Aug 2025.
        forTest:
          type: boolean
          deprecated: true
        parameters:
          type: object
          additionalProperties: {}
        processInstanceParameters:
          type: array
          items:
            $ref: '#/components/schemas/ProcessInstanceParameterConstraint'
        processInstanceInit:
          $ref: '#/components/schemas/ProcessInstanceInitParams'
        startProcessAddress:
          type: string
          readOnly: true
      required:
      - name
      - status
      - type
    ProcessInstanceInitParams:
      type: object
      properties:
        externalSources:
          $ref: '#/components/schemas/ExternalSources'
    ProcessTokenSearchDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        processDefnName:
          type: string
        processDefnVersion:
          type: integer
          format: int32
        processDefnTag:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        type:
          type: string
          enum:
          - UNLIMITED
          - MULTI_USE_COUNT_LIMITED
          - MULTI_USE_TIME_LIMITED
        createdBy:
          type: string
        lastUpdatedBy:
          type: string
        forTest:
          type: boolean
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      description: Access to the APIs is restricted by bearer auth
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      description: An API key is required to create a token
      name: X-Api-Key
      in: header
