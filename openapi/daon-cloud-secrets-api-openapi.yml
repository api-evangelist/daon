openapi: 3.2.0
info:
  title: Daon Cloud Secrets API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged Cloud Secrets across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: Cloud Secrets
paths:
  /api/process-manager/cloudSecrets:
    get:
      tags:
      - Cloud Secrets
      summary: List the Cloud Secrets
      description: 'List the Cloud Secrets that exist (for the tenant). If successful returns HTTP 200 and a page of Cloud Secrets, otherwise an appriopriate error.


        API Permissions: `TNT#{tenantid}#ProcessManager:listCloudSecrets`'
      operationId: listCloudSecrets
      parameters:
      - name: name
        in: query
        description: Filter the Cloud Secrets returned based on the name. Default to wildcard query `%`.
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: '%'
          description: Filter the Cloud Secrets returned based on the name. Default to wildcard query `%`.
      - name: page
        in: query
        description: The page index to return, defaults to 0 (the first page)
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
          description: The page index to return, defaults to 0 (the first page)
      - name: size
        in: query
        description: The maximum page size to return. Defaults to 10.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          description: The maximum page size to return. Defaults to 10.
          minimum: 1
      - name: sort
        in: query
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCloudSecretDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:listCloudSecrets
    post:
      tags:
      - Cloud Secrets
      summary: Create a Cloud Secret
      description: 'Create a Cloud Secret. Returns HTTP 201 for successful creation of the Cloud Secret, otherwise an appropriate error. Once created the Cloud Secret is assigned a unique id.

        Note:

        The Cloud Secret name must be unique

        The Cloud Secret type must be specified

        The Cloud Secret value must be specified


        API Permissions: `TNT#{tenantid}#ProcessManager:addCloudSecret`'
      operationId: addCloudSecret
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudSecret'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSecret'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:addCloudSecret
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/cloudSecrets/{cloudSecretId}:
    get:
      tags:
      - Cloud Secrets
      summary: Get a Cloud Secret
      description: 'Get a Cloud Secret based on the `id` of the Cloud Secret. If successful returns HTTP 200 and the Cloud Secret, otherwise an appropriate error.


        API Permissions: `TNT#{tenantid}#ProcessManager:getCloudSecret`'
      operationId: getCloudSecret
      parameters:
      - name: cloudSecretId
        in: path
        description: The Cloud Secret ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The Cloud Secret ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSecret'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:getCloudSecret
    post:
      tags:
      - Cloud Secrets
      summary: Update an existing Cloud Secret
      description: 'Update an Cloud Secret based in the ID. If successful returns HTTP 200 and the updated Cloud Secret, otherwise an appropriate error.

        Note:

        The Cloud Secret name cannot be changed

        The Cloud Secret type cannot be specified

        The Cloud Secret value must be specified


        API Permissions: `TNT#{tenantid}#ProcessManager:updateCloudSecret`'
      operationId: updateCloudSecret
      parameters:
      - name: cloudSecretId
        in: path
        description: The Cloud Secret ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The Cloud Secret ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudSecret'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSecret'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:updateCloudSecret
    delete:
      tags:
      - Cloud Secrets
      summary: Delete a Cloud Secret
      description: 'Delete a cloud secret based on the `id`. Returns HTTP 200 for successful deletion of the Cloud Secret, otherwise an appropriate error. Once the Cloud Secret is deleted, it cannot be referenced within the system (subject to cache expiry).


        API Permissions: `TNT#{tenantid}#ProcessManager:addCloudSecret`'
      operationId: deleteCloudSecret
      parameters:
      - name: cloudSecretId
        in: path
        description: The Cloud Secret ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The Cloud Secret ID.
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:addCloudSecret
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
components:
  schemas:
    ProcessManagerSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    AbstractSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    CloudSecret:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Cloud Secret.
          readOnly: true
        tenantId:
          type: string
          description: The Tenant ID for the Cloud Secret.
          readOnly: true
        name:
          type: string
          description: The unique name for the Cloud Secret.
          maxLength: 250
          minLength: 0
          pattern: ^[a-zA-Z0-9_]+$
        description:
          type: string
          description: The text description of the Cloud Secret for informational purposes.
          maxLength: 2000
          minLength: 0
        type:
          type: string
          description: The type of Cloud Secret value.
          enum:
          - STRING
          - NUMBER
          - BINARY
        value:
          type: string
          description: The Cloud Secret value.
          maxLength: 8192
          minLength: 0
        createdDtm:
          type: string
          format: date-time
          description: The time the Cloud Secret was created.
          readOnly: true
        lastUpdatedDtm:
          type: string
          format: date-time
          description: The time the Cloud Secret last updated.
          readOnly: true
        createdBy:
          type: string
          description: The creator of the Cloud Secret.
          readOnly: true
        lastUpdatedBy:
          type: string
          description: The last updater of the Cloud Secret.
          readOnly: true
      required:
      - name
    PageableObject:
      type: object
      properties:
        sort:
          $ref: '#/components/schemas/SortObject'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
    PageCloudSecretDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        number:
          type: integer
          format: int32
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CloudSecretDto'
        empty:
          type: boolean
    Sort:
      type: object
      properties:
        sort:
          type: array
          items:
            type: string
    CloudSecretDto:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Cloud Secret.
          readOnly: true
        name:
          type: string
          description: The unique name for the Cloud Secret.
        description:
          type: string
          description: The text description of the Cloud Secret for informational purposes.
        type:
          type: string
          description: The type of Cloud Secret value.
          enum:
          - STRING
          - NUMBER
          - BINARY
        createdDtm:
          type: string
          format: date-time
          description: The time the Cloud Secret was created.
          readOnly: true
        lastUpdatedDtm:
          type: string
          format: date-time
          description: The time the Cloud Secret last updated.
          readOnly: true
        lastUpdatedBy:
          type: string
          description: The last updater of the Cloud Secret.
          readOnly: true
  securitySchemes:
    BearerAuth:
      type: http
      description: Access to the APIs is restricted by bearer auth
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      description: An API key is required to create a token
      name: X-Api-Key
      in: header
x-refined-from:
- daon-trustx-openapi.yml
- daon-trustx-openapi.yml
