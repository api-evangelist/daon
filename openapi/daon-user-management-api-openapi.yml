      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUser
    post:
      tags:
      - User Management
      summary: Update an existing user by internal user ID
      description: 'Update the biographic info, locale info, external ID, type, attributes and status of a user. **Only the fields to be updated need to be supplied**


        Updatable fields:

        - extId

        - type

        - firstName

        - lastName

        - email

        - locale

        - timezone

        - dateOfBirth

        - status

        - attributes


        **NOTE** Updating the user status to `ACTIVE` or `DISABLED` will reset user locks.


        **NOTE 2** When updating the user status to `TEMP_LOCKED` a `lockedUntilDtm` must be supplied.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:updateUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:updateUser`'
      operationId: updateUser
