    UserSession:
      type: object
      description: 'User session data for an appkey or passkey operation. The structure contains common data and specific data for appkey and passkey operations.


        Appkey and passkey registration and authentication is a two-step process:

        - Step 1 is generating the request to send to the client

        - Step 2 is returning the response from the client for validation


        Session data is generated at step 1 which is required to complete step 2. If an appkey or passkey policy for a store has `sessionManagementExternal` set to `false` then the session data is cached in server memory for a limited time specified by the configured `sessionDuration` and is referenced by a unique session ID.


        '
      properties:
        id:
          type: string
          description: The unique session ID.
        storeId:
          type: string
          description: The store database ID.
        sessionType:
          type: string
          description: The session type.
          enum:
          - PASSKEY_REG
          - PASSKEY_AUTH
          - APPKEY_REG
          - APPKEY_AUTH
          - PASSCODE_REG
          - PASSCODE_AUTH
          - PASSCODE_RENEW
          - VOICE_AUTH
        userId:
          type: string
          description: The user database ID.
        passkeySessionData:
          $ref: '#/components/schemas/PasskeySessionData'
          description: The passkey-specific session data for a passkey operation.
        appkeySessionData:
          $ref: '#/components/schemas/AppkeySessionData'
          description: The appkey-specific session data for an appkey operation.
