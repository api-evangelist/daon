          - SN_CTS_PROFILE_MATCH
          - SN_BASIC_INTEGRITY
          - IA_DEVICE_INTEGRITY
          - IA_APP_LICENSING
          - IA_APP_RECOGNITION
        evaluationRule:
          type: string
    AuthOptionResponse:
      type: object
      description: The public key assertion generation options to be supplied to the user agent to generate an authentication assertion for a passkey credential. See the [webauthn specification](https://www.w3.org/TR/webauthn-2/) for details
      properties:
        challenge:
          type: string
        timeout:
          type: integer
          format: int64
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/ServerPublicKeyCredentialDescriptor'
        userVerification:
          type: string
          description: "Whether user verification is required on the authenticator. Possible values: \n- **required**: The relying party requires user verification. Fail if user verification is not supported.\n- **preferred**: The relying party prefers user verification. Don't fail if it is not supported. RECOMMENDED VALUE.\n- **discouraged**: The relying does not want user verification."
          enum:
          - required
          - preferred
          - discouraged
        hints:
          type: array
          description: Zero or more hints to guide the user agent in interacting with the user during authentication. Hints are ordered by decreasing preference and are not requirements.
          items:
            type: string
            description: "Hints to guide the user agent in interacting with the user during registration or authentication. Hints are not requirements and do not bind the user agent. They are provided in order of decreasing preference. Possible values: \n- **security-key**: The relying party believes that users will satisfy this request with a physical security key.\n- **client-device**: The relying party believes that users will satisfy this request with a platform authenticator attached to the client device.\n- **hybrid**: The relying party believes that users will satisfy this request with general-purpose authenticators such as smartphones."
            enum:
            - security-key
            - client-device
            - hybrid
        extensions:
          $ref: '#/components/schemas/AuthenticationExtensionsClientInputs'
    AuthenticationPasskeyInfo:
      type: object
      properties:
        id:
          type: string
          description: The ID of the passkey in the database.
        rpId:
          type: string
          description: The relying party ID.
        authPolicyName:
          type: string
          description: The authentication policy defined for the relying party.
        verifyCredential:
          $ref: '#/components/schemas/VerifyCredential'
          description: Protocol-specific information related to the authentication.
        passkeyAuthRequest:
          $ref: '#/components/schemas/AuthOptionResponse'
          description: The passkey assertion generation options used as a request to the user agent.
        metadata:
          $ref: '#/components/schemas/TrustWebClientMetadata'
          description: Metadata about the client.
        context:
          type: object
          additionalProperties:
            type: object
          description: Context data about the client.
        publicKey:
          type: string
          format: byte
          description: The passkey's encoded public key.
        registrationDtm:
          type: string
          format: date-time
          description: The passkey's registration date/time.
    PresentedDataDto:
      type: object
      description: The presented data and content type extracted from an authentication audit record. The presentedData and contentType are only populated for Face and VoicePassive audits where the presented data is available.
      properties:
        type:
          type: string
          description: The type of audit, ascertained from the audit record contents.
          enum:
          - Passkey
          - Appkey
          - Face
          - VoiceActive
          - VoicePassive
          - TOTP
          - Passcode
        presentedData:
          type: string
          format: byte
          description: The presented data, if available, encoded as base64.
        contentType:
          type: string
          description: The content type of the presented data, if available.
      required:
      - type
    Version:
      type: object
      properties:
        major:
          type: integer
          format: int32
        minor:
          type: integer
          format: int32
    VoiceAuthenticationRecord:
      type: object
      description: The results of a voice authentication
      properties:
        authId:
          type: string
          description: Optional authentication ID from the external authentication sytem
        presentedSubtype:
          type: string
          description: The voice subtype, for example the voice algorithm `Image` of the presented sample.
        referenceSubtype:
          type: string
          description: The voice subtype, for example the voice template `DVASVTI5_8K` of the reference sample.
        referenceVersionId:
          type: string
          description: The voice version ID, of the reference sample.
        sourceReferenceSubtype:
          type: string
          description: The voice subtype, of the source of the reference sample.
        sourceReferenceVersionId:
          type: string
          description: The voice version ID, of the source of the reference sample.
        status:
          type: string
          description: The authentication status, for example `SUCCESS`.
          enum:
          - SUCCESS
          - FAILURE
          - INCOMPLETE
          - UNKNOWN
        rawScore:
          type: number
          format: double
          description: The internal match score.
        score:
          type: number
          format: double
          description: The authentication score matched against the threshold. For a match the score will be equal to or below the threshold.
        threshold:
          type: number
          format: double
          description: The authentication threshold.
        policy:
          type: string
          description: The policy used for the authentication.
        voiceMatcherVersion:
          type: string
          description: The voice matcher version used for the authentication.
        presentedData:
          type: string
          format: byte
          description: The authentication data, i.e. the voice sample or template.
        contentType:
          type: string
          description: The content type of the authentication data.
        chunkReferences:
          type: array
          description: References to the voice audio chunks used for authentication.
          items:
            type: string
        sourceType:
          type: string
          description: The source type of the reference sample, for example `CALL`.
        callMetadataList:
          type: array
          description: Call metadata supplied with the authentication request.
          items:
            $ref: '#/components/schemas/CallMetadata'
        config:
          type: object
          additionalProperties:
            type: object
          description: Configuration supplied with the authentication request.
        metadata:
          $ref: '#/components/schemas/TrustWebClientMetadata'
          description: Metadata supplied with the authentication request.
        context:
          type: object
          additionalProperties:
            type: object
          description: Context supplied with the authentication request.
      required:
      - chunkReferences
      - policy
      - presentedData
      - presentedSubtype
      - rawScore
      - referenceSubtype
      - referenceVersionId
      - score
      - sourceReferenceSubtype
      - sourceReferenceVersionId
      - sourceType
      - status
      - threshold
      - voiceMatcherVersion
