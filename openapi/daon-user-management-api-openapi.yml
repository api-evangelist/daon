    AuthenticationAudit:
      type: object
      description: 'An authentication audit record

        An authentication record contains common fields such as the type and references to the tenant, store and user and specific information depending on the type: appkey/passkey/biometric/TOTP.'
      properties:
        version:
          type: integer
          format: int32
          description: The version of the audit structure
        type:
          type: string
          description: The type of audit, for example `Face`
          enum:
          - Passkey
          - Appkey
          - Face
          - VoiceActive
          - VoicePassive
          - TOTP
          - Passcode
        id:
          type: string
          description: A unique audit ID
        createdDtm:
          type: string
          format: date-time
        tenantId:
          type: string
          description: The tenant ID
        storeId:
          type: string
          description: The database store ID
        storeName:
          type: string
          description: The store name
        userId:
          type: string
          description: The database user ID
        extUserId:
          type: string
          description: The external user ID provided by the customer
        errorMessage:
          type: string
          description: An error message if the authentication failed
        errorCode:
          type: integer
          format: int32
          description: An error code which should have a non-zero value if the authentication failed
        result:
          type: string
          description: 'The authentication result: SUCCESS or FAILED'
          enum:
          - SUCCESS
          - FAILED
        appkeyInfo:
          $ref: '#/components/schemas/AuthenticationAppkeyInfo'
          description: For appkey authentications this field contains information specific to appkey authentication
        passkeyInfo:
          $ref: '#/components/schemas/AuthenticationPasskeyInfo'
          description: For passkey authentications this field contains information specific to passkey authentication
        faceAuthenticationRecord:
          $ref: '#/components/schemas/FaceAuthenticationRecord'
          description: For face authentications this field contains information specific to face
        totpInfo:
          $ref: '#/components/schemas/AuthenticationTOTPInfo'
          description: For TOTP authentications this field contains information specific to TOTP authentication
        passcodeInfo:
          $ref: '#/components/schemas/AuthenticationPasscodeInfo'
          description: For passcode authentications this field contains information specific to passcode authentication
        voiceAuthenticationRecord:
          $ref: '#/components/schemas/VoiceAuthenticationRecord'
          description: For voice authentications this field contains information specific to voice
