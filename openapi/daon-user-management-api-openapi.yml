openapi: 3.2.0
info:
  title: Daon User Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Management
paths:
  /api/identity-store/stores/{storeName}/users/{extId}/authentications/ext:
    get:
      tags:
      - User Management
      summary: List user authentications by external user ID
      description: 'Return a list of user authentication summaries which can be filtered by type, outcome and date range.


        **NOTE**: Results are returned as *slices* rather than *pages* for efficiency so no pagination is possible when displaying this data.### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserAuthenticationsByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserAuthenticationsByExtId`'
      operationId: listUserAuthenticationsByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extId
        in: path
        description: external ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: type
        in: query
        description: Type regex (supports wildcard search). For example biometric, passkey.
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: .*
        example: appkey
      - name: outcome
        in: query
        description: 'Outcome regex (supports wildcard search). Values: Success or Failed.'
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: .*
        example: Success
      - name: from
        in: query
        description: From date. Default is one day before now.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To date. Default is now.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: Page number.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Page size.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: User authentications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceAuthenticationSummary'
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUserAuthenticationsByExtId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/authentications/{id}/presentedData:
    get:
      tags:
      - User Management
      summary: Get the presented data for a user authentication record by internal ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getUserAuthenticationPresentedData` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getUserAuthenticationPresentedData`'
      operationId: getUserAuthenticationPresentedData
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User authentication presented data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentedDataDto'
        '400':
          description: 'An error occurred. Possible error codes:

            - **840**: Invalid authentication ID format

            - **841**: Failed to retrieve audit record

            - **842**: Failed to decompress audit record

            - **3200**: Failed to build the presented data response

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUserAuthenticationPresentedData
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users:
    get:
      tags:
      - User Management
      summary: List users
      description: 'Return a list of users which can be filtered by external ID.


        **NOTE**: Users are returned as *slices* rather than *pages* for efficiency so no pagination is possible when displaying this data.### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUsers` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUsers`'
      operationId: listUsers
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: idSearch
        in: query
        description: User external ID filter (supports wildcard search) or full user id to find specific user.
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: '%'
      - name: searchMode
        in: query
        description: Search mode. Default if not supplied is `STANDARD` which is a backwards-compatible mode which doesn't return any authentication timing information. Other options are `LAST_AUTHENTICATED` which includes `lastAuthenticatedDtm` for each user, and `LAST_AUTHENTICATED_EXTENDED` which additionally includes `lastAuthentication` (most recent authenticator) and `lastAuthentications` (most recent authenticator per factor type).
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: STANDARD
          description: 'Search mode optionally supplied when listing users. Controls what authentication timing information is included in the response. Possible values:

            - **STANDARD**: backwards-compatible mode. No authentication timing information is returned (`lastAuthenticatedDtm`, `lastAuthentication` and `lastAuthentications` are omitted).

            - **LAST_AUTHENTICATED**: returns `lastAuthenticatedDtm` for each user (the timestamp of their most recent authentication). `lastAuthentication` and `lastAuthentications` are omitted.

            - **LAST_AUTHENTICATED_EXTENDED**: returns `lastAuthenticatedDtm` plus detailed `lastAuthentication` (the most recently used authenticator) and `lastAuthentications` (the most recently used authenticator per factor type e.g. Passkey, Face, TOTP).

            '
          enum:
          - STANDARD
          - LAST_AUTHENTICATED
          - LAST_AUTHENTICATED_EXTENDED
      - name: page
        in: query
        description: The page number.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The page size.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting parameter. Default ascending by external ID.


          **NOTE** The users table may contain millions of entries. Sorting is only recommended on indexed fields. Currently these are:

          - extId

          - email

          - lastName

          - createdDtm

          - lastAuthenticatedDtm

          '
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceUserSearchDto'
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUsers
    post:
      tags:
      - User Management
      summary: Create a new user within an identity store
      description: 'Creates a new user with some biographical details, an optional external ID supplied by the customer, locale information and optional additional attributes. A user has a status which indicates whether they are pending, active, locked or disabled. The initial defaultstatus and locale are configured at the store level.


        **NOTE**: If a user is created without an extId, the system will generate a GUID and set this as the external ID for the user.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createUser`'
      operationId: createUser
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The user to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'An error occurred. Possible error codes:

            - **504**: Max number of users reached for this tenant

            - **506**: A user with a duplicate external ID exists

            - **507**: A data integrity violation occurred when saving the user to the database

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createUser
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
