    VerifyCredential:
      type: object
      description: 'Information provided from the user agent on a successful passkey authentication.


        If the authentication is successful the `serverPublicKeyCredential` must be provided and an optional `tokenBinding`. If the authentication failed on the client then the `clientError` must be provided. In both cases it is recommended to supply `metadata` with as many fields populated as possible.'
      properties:
        metadata:
          $ref: '#/components/schemas/TrustWebClientMetadata'
          description: Client metadata to be audited
        context:
          type: object
          additionalProperties:
            type: object
          description: Additional client context data to be audited
        serverPublicKeyCredential:
          $ref: '#/components/schemas/ServerAuthPublicKeyCredential'
          description: The public key credential information containing the authenticator assertion response described in the [Web Authentication Specification](https://www.w3.org/TR/webauthn-2/#iface-pkcredential).
        tokenBinding:
          $ref: '#/components/schemas/TokenBinding'
          description: Optional token binding which is compared against the collected client data as defined in the [Web Authentication Specification](https://www.w3.org/TR/webauthn-2).
        clientError:
          $ref: '#/components/schemas/PasskeyClientError'
          description: Client error information
    AppkeySessionData:
      type: object
      description: Session data specific to an appkey operation in progress.
      properties:
        appId:
          type: string
          description: This ID is used to identify a trusted facets URL which contains the set of trusted apps for this relying party configuration. If there is only one app then this field is set to `null` and the default `trustedFacets` are used.
        rpId:
          type: string
          description: The relying party ID.
        singleShot:
          type: boolean
          description: True if this is a *single-shot* authentication where the request is generated on the device, false otherwise.
        extUserId:
          type: string
          description: The external user ID.
        userId:
          type: string
          description: The internal database user ID.
        userStatus:
          type: string
          description: The user status.
          enum:
          - PENDING_ACTIVE
          - ACTIVE
          - TEMP_LOCKED
          - LOCKED
          - DISABLED
        challenge:
          type: string
          description: The registration or authentication challenge
        regPolicyName:
          type: string
          description: The policy name for a registration operation
        authPolicyName:
          type: string
          description: The policy name for an authentication operation
        serverData:
          type: string
          description: Optional additional server data shared between the request and response.
        transaction:
          type: array
          description: Optional transaction data for step-up authentications.
          items:
            $ref: '#/components/schemas/FIDOTransaction'
        policy:
          $ref: '#/components/schemas/FIDOPolicy'
          description: The policy which describes acceptable appkey authenticators.
        registrationRequest:
          $ref: '#/components/schemas/FIDORegistrationRequest'
          description: The appkey registration request with headers and challenge, built based on the params to send to SDK for registration
        authRequest:
          $ref: '#/components/schemas/FIDOAuthenticationRequest'
          description: The appkey authentication request with headers and challenge, built based on the params to send to SDK for authentication
    AuthenticationSummary:
