openapi: 3.2.0
info:
  title: Daon User Passcode Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Passcode Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Passcode Management
paths:
  /api/identity-store/stores/{storeName}/passcodes/renewals/sessions/{sessionId}:
    post:
      tags:
      - User Passcode Management
      summary: Complete a passcode renewal
      description: 'This API is used to complete a passcode renewal for the session created when the renewal was created.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completePasscodeRenewal` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completePasscodeRenewal`'
      operationId: completePasscodeRenewal
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: sessionId
        in: path
        description: The session ID returned by the server when the authentication was requested
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The client renewal response message.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPasscodeRenewalResponse'
        required: true
      responses:
        '200':
          description: Passcode renewal completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePasscodeRenewalResponse'
        '400':
          description: "An error occurred during renewal:\n- **xxxx**: \n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **2601**: Passcode policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completePasscodeRenewal
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/passcodes/registrations/sessions/{sessionId}:
    post:
      tags:
      - User Passcode Management
      summary: Complete a passcode registration
      description: 'Complete a passcode registration for the session created when the registration was created.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completePasscodeRegistration` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completePasscodeRegistration`'
      operationId: completePasscodeRegistration
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: sessionId
        in: path
        description: The session ID returned by the server when the registration was requested
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The client registration response message.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPasscodeRegistrationResponse'
        required: true
      responses:
        '200':
          description: Passcode registration completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePasscodeRegistrationResponse'
        '400':
          description: 'An error occurred during registration:

            - **2603**: No registration session corresponding to the supplied session ID was found

            - **2606**: Registration blocked because of the user''s status

            - **2607**: A passcode is already registered for this user and policy

            - **2609**: The maximum number of passcodes for the user has been reached

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found by supplied user ID in session data

            - **2601**: Passcode policy not found

            - **2603**: Passcode registration session not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:completePasscodeRegistration
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{extUserId}/passcodes/registrations/{policyName}/ext:
    post:
      tags:
      - User Passcode Management
      summary: Start a registration for a client-validated password belonging to an existing…
      description: 'This API returns the passcode validation requirements to the client and information specific to the passcode algorithm.It also returns a session ID which is returned to the server when completing the registration.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createPasscodeRegistrationForUserByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createPasscodeRegistrationForUserByExtUserId`'
      operationId: createPasscodeRegistrationForUserByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extUserId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: policyName
        in: path
        description: The name of the passcode policy
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '201':
          description: passcode registration started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPasscodeRegistrationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2606**: Passcode Registration disallowed for non-active user

            - **2607**: Passcode already registered for the user

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2601**: Passcode policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createPasscodeRegistrationForUserByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userExtId}/passcodes/ext:
    get:
      tags:
      - User Passcode Management
      summary: List registered passcodes for a user (identified by external ID)
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserPasscodesByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserPasscodesByExtUserId`'
      operationId: listUserPasscodesByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User passcodes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/UserPasscode'
              example: "[\n  {\n    \"id\": \"7NWPL7KIMGAPSXKTP4TRHNTPXM\",\n    \"storeId\": \"V4HY243RDEQJMT62OF6I7VVFQE\",\n    \"userId\": \"M5CKIGYEK7FWGD76ZY3D7Q6X6U\",\n    \"policyName\": \"passcodePolicy1\",\n    \"status\": \"ACTIVE\",\n    \"createdDtm\": \"2025-09-11T16:15:23.651Z\",\n    \"lastUpdatedDtm\": \"2025-09-11T16:20:23.651Z\",\n    \"lastUsedDtm\": \"2025-09-11T16:20:23.651Z\",\n    \"lastRenewedDtm\": \"2025-09-11T16:30:23.651Z\",\n    \"expirationDate\": \"2025-11-11\"\n  },\n  {\n    \"id\": \"SBNKFCEC5NTX65LIBTJZMOJARE\",\n    \"storeId\": \"V4HY243RDEQJMT62OF6I7VVFQE\",\n    \"userId\": \"M5CKIGYEK7FWGD76ZY3D7Q6X6U\",\n    \"policyName\": \"passcodePolicy2\",\n    \"status\": \"ACTIVE\",\n    \"createdDtm\": \"2025-09-11T16:15:23.651Z\",\n    \"lastUpdatedDtm\": \"2025-09-11T16:20:23.651Z\",\n    \"lastUsedDtm\": \"2025-09-11T16:20:23.651Z\",\n    \"lastRenewedDtm\": \"2025-09-11T16:20:23.651Z\"\n    \"expirationDate\": \"2025-11-11\"\n  }\n]"
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUserPasscodesByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{extUserId}/passcodes/authentications/{policyName}/ext:
    post:
      tags:
      - User Passcode Management
      summary: Start an authentication for a client-validated password belonging to an…
      description: 'This API returns information specific to the passcode algorithm and a session ID which is returned to the server when completing the authentication.


        **Note:** When SRP user enumeration protection is enabled, this endpoint returns a valid-looking response even for non-existent or invalid users.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUserByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUserByExtUserId`'
      operationId: createPasscodeAuthenticationForUserByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extUserId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: policyName
        in: path
        description: The name of the passcode policy
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '201':
          description: passcode authentication started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPasscodeAuthenticationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2100**: Passcode authentication disallowed for locked user

            - **2101**: Passcode authentication disallowed for locked modality

            - **2611**: Passcode authentication disallowed for non-active user

            - **2612**: User has no registered passcode for this policy

            - **2613**: The passcode is not active

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2601**: Passcode policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUserByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/passcodes/authentications/{policyName}:
    post:
      tags:
      - User Passcode Management
      summary: Start an authentication for a client-validated password belonging to an…
      description: 'This API returns information specific to the passcode algorithm and a session ID which is returned to the server when completing the authentication.


        **Note:** When SRP user enumeration protection is enabled, this endpoint returns a valid-looking response even for non-existent or invalid users.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUser`'
      operationId: createPasscodeAuthenticationForUser
