components:
  schemas:
    PasscodeSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        policyName:
          type: string
          description: Identifies the identity store passcode policy.
        status:
          type: string
          description: The status of the user passcode.
          enum:
          - ACTIVE
          - DISABLED
        lastRenewedDtm:
          type: string
          format: date-time
          description: The last time the passcode was renewed. Only present if a renewal has occurred.
        expirationDate:
          type: string
          format: date
          description: Expiration date for a passcode. Only required if regular renewals are enforced.
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this passcode has not been used for authentication then this field is not present.
    UpdatePasscodeRequest:
      type: object
      description: A request structure for updating user passcode record status.
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      required:
      - status
    PasscodeRequirements:
      type: object
      description: Passcode requirements for client-validated passcode registration.
      properties:
        minimumLength:
          type: integer
          format: int32
          description: An optional passcode minimum length.
        maximumLength:
          type: integer
          format: int32
          description: An optional passcode maximum length.
        digitCount:
          type: integer
          format: int32
          description: Optional minimum number of digits within the passcode.
        symbolCount:
          type: integer
          format: int32
          description: Optional minimum number of symbols within the passcode.
        lowerCaseCount:
          type: integer
          format: int32
          description: Optional minimum number of lower case characters within the passcode.
        upperCaseCount:
          type: integer
          format: int32
          description: Optional minimum number of upper case characters within the passcode.
        characterVariety:
          type: integer
          format: int32
          description: Optional minimum number of different classes of character that the passcode must contain, where the classes are symbols, digits, upper case and lower case.
        passcodeHistory:
          type: integer
          format: int32
          description: Optional passcode history. A submitted passcode is checked against a configurable number of previously submitted passcodes to see if it matches.
        requiredRegExes:
          type: array
          description: Optional list of required regular expressions, all of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
        allowedRegExes:
          type: array
          description: Optional list of allowed regular expressions, at least one of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
        disallowedRegExes:
          type: array
          description: Optional list of disallowed regular expressions, none of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
    SrpRegistrationData:
      type: object
      description: The SRP registration data generated by a client.
      properties:
        salt:
          type: string
          format: byte
          description: Salt used in the SRP protocol. The SRP protocol suggests that this is generated by the client. In our implementation, the server generates it and sends it to the client to allow for a consistent salt across historical passcodes.
        verifier:
          type: string
          format: byte
          description: Verifier used in the SRP protocol, derived by the client from the user's passcode.
    StartPasscodeRegistrationResponse:
      type: object
      description: The response from the create passcode registration API
      properties:
        passcodeRequirements:
          $ref: '#/components/schemas/PasscodeRequirements'
        algorithmInfo:
          $ref: '#/components/schemas/PasscodeAlgorithmInfo'
        sessionId:
          type: string
          description: The session ID which must be supplied to the server when completing client-validated passcode registration.
    DeviceSummary:
      type: object
      description: 'Summary information about a device containing keys registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: 'A unique identifier of the device on which the keys are installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        rpId:
          type: string
          description: The relying party ID.
        os:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        name:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        keys:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AppkeySummary'
          description: 'A map of appkey types to list of key summary information where the key types are:

            - **DEVICE**: A device appkey which authenticates the device without user input.

            - **BIOMETRIC**: A biometric appkey which authenticates the user using a biometric.

            List is here to support "more than one app keys of the same type" concept, but in most cases we expect the size of it will be one.'
    CompletePasscodeRenewalResponse:
      type: object
      description: The response from the complete renewal API. Includes the updated user information and output from the passcode algorithm for the client to validate.
      properties:
        algorithmInfo:
          $ref: '#/components/schemas/PasscodeAlgorithmInfo'
        user:
          $ref: '#/components/schemas/UserDto'
    IdStoreSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    TrustXLocale:
      type: object
      description: Locale information. Exposes the language, country and variant locale components, for example `en_US_UNIX` contains these components as `en`, `US` and `UNIX` respectively.
      properties:
        language:
          type: string
          description: The mandatory locale language component
        country:
          type: string
          description: The optional locale country component
        variant:
          type: string
          description: The optional locale variant component
    UserLocks:
      type: object
      description: 'User lock information.


        Describes locks at the user level and modality level. A user can have escalating temporary locks which come into effect after a certain number of consecutive authentication attempts. The number of locks and the lock durations are configured at the store level.


        **NOTE**: Currently only user-level locking is supported with modality level locking planned for a later release.'
      properties:
        lockCounter:
          type: integer
          format: int32
          description: The number of consecutive locks tagged for this user.
        tempLockedAt:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock came into effect.
        tempLockedUntil:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock ends.
        lockedAt:
          type: string
          format: date-time
          description: If the user is *permanently* locked then this is the time at which the lock came into effect.
        userModalityLocks:
          type: array
          description: 'Locking information related to particular authentication modalities.


            **Not supported in this release**'
          items:
            $ref: '#/components/schemas/UserModalityLock'
    DeregisterPasscodeResponse:
      type: object
      description: The response from the deregister passcode API. Includes the updated user information.
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
    SrpVerificationData:
      type: object
      description: The SRP verification data generated by a client.
      properties:
        clientPublicKey:
          type: string
          format: byte
          description: The client's public key.
        m1:
          type: string
          format: byte
    StartPasscodeRenewalResponse:
      type: object
      description: The response from the create passcode renewal API
      properties:
        passcodeRequirements:
          $ref: '#/components/schemas/PasscodeRequirements'
        algorithmInfo:
          $ref: '#/components/schemas/PasscodeAlgorithmInfo'
        sessionId:
          type: string
          description: The session ID which must be supplied to the server when completing client-validated passcode renewal.
    AppkeySummary:
      type: object
      description: 'Summary information about an appkey registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        deviceId:
          type: string
          description: 'A unique identifier of the device on which the appkey is installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        deviceOs:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device make and model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceName:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        rpId:
          type: string
          description: The relying party ID.
        aaid:
          type: string
          description: A unique identifier of the appkey type.
        keyId:
          type: string
          description: A unique identifier of the particular appkey credential.
        status:
          type: string
          description: The status of the appkey.
          enum:
          - ACTIVE
          - DISABLED
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this appkey has not been used for authentication then this field is not present.
    CompletePasscodeAuthenticationResponse:
      type: object
      description: The response from the complete authentication API. Includes the updated user information and output from the passcode algorithm for the client to validate.
      properties:
        algorithmInfo:
          $ref: '#/components/schemas/PasscodeAlgorithmInfo'
        user:
          $ref: '#/components/schemas/UserDto'
    UserDtoSummaryInfo:
      type: object
      description: Summary information about items registered to the user such as biometrics, device keys and passkeys.
      properties:
        biometrics:
          type: array
          items:
            $ref: '#/components/schemas/BiometricSummary'
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeySummary'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSummary'
        totps:
          type: array
          items:
            $ref: '#/components/schemas/TOTPSummary'
        passcodes:
          type: array
          items:
            $ref: '#/components/schemas/PasscodeSummary'
    UserModalityLock:
      type: object
      description: 'Modality lock information.


        Describes locks at the modality level. A modality can have escalating temporary locks which come into effect after a certain number of consecutive authentication attempts. The number of locks and the lock durations are configured at the store level.


        **NOTE**: Currently only user-level locking is supported with modality level locking planned for a later release.'
      properties:
        lockCounter:
          type: integer
          format: int32
          description: The number of consecutive locks tagged for this modality.
        tempLockedAt:
          type: string
          format: date-time
          description: If the modality is *temporarily* locked then this is the time at which the lock came into effect.
        tempLockedUntil:
          type: string
          format: date-time
          description: If the modality is *temporarily* locked then this is the time at which the lock ends.
        lockedAt:
          type: string
          format: date-time
          description: If the modality is *permanently* locked then this is the time at which the lock came into effect.
        type:
          type: string
          description: The modality type, for example `Face`.
    StartPasscodeAuthenticationResponse:
      type: object
      description: The response from the create passcode authentication API
      properties:
        algorithmInfo:
          $ref: '#/components/schemas/PasscodeAlgorithmInfo'
        sessionId:
          type: string
          description: The session ID which must be supplied to the server when completing client-validated passcode authentication.
    UserDto:
      type: object
      description: A user in an identity store.
      properties:
        id:
          type: string
          description: Unique 26-character database user ID.
        storeName:
          type: string
          description: The name of the store in which this user resides.
        status:
          type: string
          description: 'The user''s status: pending, active, locked or disabled.'
          enum:
          - PENDING_ACTIVE
          - ACTIVE
          - TEMP_LOCKED
          - LOCKED
          - DISABLED
        extId:
          type: string
          description: A unique ID of the user supplied by the customer.
        type:
          type: string
          description: A user type supplied by the customer.
        locale:
          $ref: '#/components/schemas/TrustXLocale'
          description: The user's locale. The default locale configured at the store level.
        timezone:
          type: string
          description: The user's timezone. The default timezone configured at the store level.
          example: Europe/London
        firstName:
          type: string
          description: The user's first name.
        lastName:
          type: string
          description: The user's last name.
        email:
          type: string
          description: The user's email address.
        dateOfBirth:
          type: string
          format: date
          description: The user's date of birth.
        nationalities:
          type: array
          description: A list of nationalities associated with the user.
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: object
          description: "A list of attributes associated with the user.\n\nOne attribute, which is set **internally** by the server on a user during passkey registration, is `passkeyUsers`. A specific user handle may be provided via the passkey registration request, if not it is set to a random ID when the first passkey is created for the user. The attribute value looks like this:.\n\n```\"passkeyUsers\": {\n  \"{relyingPartyId}\": {\n    \"USER_HANDLE\":\"{passkey user handle}\"\n  }\n} \n```"
        summaryInfo:
          $ref: '#/components/schemas/UserDtoSummaryInfo'
          description: Summary information about items registered to the user.
        locks:
          $ref: '#/components/schemas/UserLocks'
          description: User lock information.
        lockedUntilDtm:
          type: string
          format: date-time
          description: If the user is currently locked, this is the time at which the lock will end.
        lastAuthenticatedDtm:
          type: string
          format: date-time
          description: If the user has been authenticated, this is the time at which they were last authenticated.
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
    ClientPasscodeAuthenticationResponse:
      type: object
      description: The passcode authentication response returned from the client.
      properties:
        srpVerificationData:
          $ref: '#/components/schemas/SrpVerificationData'
    ClientPasscodeRenewalResponse:
      type: object
      description: The passcode renewal response returned from the client.
      properties:
        srpVerificationData:
          $ref: '#/components/schemas/SrpVerificationData'
        srpRegistrationData:
          $ref: '#/components/schemas/SrpRegistrationData'
    TOTPSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        status:
          type: string
          description: The status of the user TOTP.
          enum:
          - ACTIVE
          - PENDING
          - DISABLED
        issuer:
          type: string
          description: The issuer of the user TOTP.
        username:
          type: string
          description: The user name label used for registering TOTP.
        policyName:
          type: string
          description: TOTP Policy name
        algorithm:
          type: string
          description: The algorithm used to validate the authentication code.
        activatedDtm:
          type: string
          format: date-time
          description: Date and time of the TOTP activation - this is time when first auth with TOTP happened and marked TOTP as active.
        expirationDtm:
          type: string
          format: date-time
          description: Expiration dtm for the pending TOTPs - this is time before which is possible to activate pending TOTP.
        lastAuthenticatedWithDtm:
