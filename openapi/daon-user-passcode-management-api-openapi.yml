            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2601**: Passcode policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createPasscodeAuthenticationForUser
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/passcodes/{id}:
    get:
      tags:
      - User Passcode Management
      summary: Get a passcode for a user identified by internal ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getUserPasscode` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getUserPasscode`'
      operationId: getUserPasscode
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the passcode
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User passcode retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPasscode'
              example:
                id: 7NWPL7KIMGAPSXKTP4TRHNTPXM
                storeId: V4HY243RDEQJMT62OF6I7VVFQE
                userId: M5CKIGYEK7FWGD76ZY3D7Q6X6U
                policyName: passcodePolicy1
                status: ACTIVE
                createdDtm: {}
                lastUpdatedDtm: {}
                lastUsedDtm: {}
                lastRenewedDtm: {}
                expirationDate: {}
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2610**: Passcode not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUserPasscode
    post:
      tags:
      - User Passcode Management
      summary: Update an existing passcode's status or expiration date by internal user ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:updateUserPasscode` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:updateUserPasscode`'
      operationId: updateUserPasscode
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the passcode
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user passcode update information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasscodeRequest'
        required: true
      responses:
        '200':
          description: User passcode updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPasscode'
        '400':
          description: 'An error occurred. Possible error codes:

            - **1114**: No update information provided

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2610**: Passcode not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:updateUserPasscode
    delete:
      tags:
      - User Passcode Management
      summary: Delete a user passcode by internal user ID and user passcode ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deleteUserPasscode` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deleteUserPasscode`'
      operationId: deleteUserPasscode
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the User passcode
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User passcode deleted successfully
        '400':
          description: An error occurred.
          content:
            application/json:
