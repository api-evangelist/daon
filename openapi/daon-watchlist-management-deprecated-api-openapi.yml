  /api/watchlist-manager/facewatchlists/{watchlistId}:
    get:
      tags:
      - Watchlist Management (Deprecated)
      summary: Get a watchlist. (DEPRECATED)
      description: 'Get a watchlist based on the watchlist id. Returns detailed information on the watchlist. DEPRECATED: Use ''/watchlists'' API endpoints instead.


        API Permissions: `TNT#{tenantid}#WatchlistManager:getWatchlist`'
      operationId: getWatchlist
      parameters:
      - name: watchlistId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
