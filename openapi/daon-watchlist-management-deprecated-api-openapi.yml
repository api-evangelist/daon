components:
  schemas:
    AbstractSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    PageWatchlistDto:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        first:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistDto'
        empty:
          type: boolean
    UpdateWatchlistDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DELETING
        expireMembersAfter:
          type: string
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    WatchlistCreateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 250
          minLength: 0
          pattern: ^[a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DELETING
        type:
          type: string
          enum:
          - facev6
          - documentNumber
          - ipv4Address
          - visitorID
          - phoneNumber
          - email
        expireMembersAfter:
          type: string
      required:
      - name
    WatchlistDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - facev6
          - documentNumber
          - ipv4Address
          - visitorID
          - phoneNumber
          - email
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DELETING
        maxSize:
          type: integer
          format: int32
        numMembers:
          type: integer
          format: int32
        expireMembersAfter:
          type: string
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUpdatedBy:
          type: string
    PageableObject:
      type: object
      properties:
        sort:
          $ref: '#/components/schemas/SortObject'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
    Sort:
      type: object
      properties:
        sort:
          type: array
          items:
            type: string
  securitySchemes:
    BearerAuth:
      type: http
      description: Access to the APIs is restricted by bearer auth
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      description: An API key is required to create a token
      name: X-Api-Key
      in: header
