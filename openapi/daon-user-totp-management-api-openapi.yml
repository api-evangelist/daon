  /api/identity-store/stores/{storeName}/users/{userExtId}/totps/registrations/{policyName}/complete/ext:
    post:
      tags:
      - User TOTP Management
      summary: Complete a TOTP registration for an existing user identified by its external ID…
      description: 'This API is to complete registration for pending user TOTP that is created with Start TOTP Registration Call. Completing TOTP registration is actually first successful authentication attempt for pending user TOTP. API is getting authentication code from user with the request body, and then checks it against the codes it generates for all existing non-expired pending TOTPs for same user (using the shared secret key stored with every user totp). If there is a match, completion of registration is successful, matching user TOTP status is set to ACTIVE and some additional fields are also set.

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:completeTOTPRegistrationForUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:completeTOTPRegistrationForUserByExtUserId`'
      operationId: completeTOTPRegistrationForUserByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
