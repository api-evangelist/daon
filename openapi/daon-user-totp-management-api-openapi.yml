components:
  schemas:
    UserDto:
      type: object
      description: A user in an identity store.
      properties:
        id:
          type: string
          description: Unique 26-character database user ID.
        storeName:
          type: string
          description: The name of the store in which this user resides.
        status:
          type: string
          description: 'The user''s status: pending, active, locked or disabled.'
          enum:
          - PENDING_ACTIVE
          - ACTIVE
          - TEMP_LOCKED
          - LOCKED
          - DISABLED
        extId:
          type: string
          description: A unique ID of the user supplied by the customer.
        type:
          type: string
          description: A user type supplied by the customer.
        locale:
          $ref: '#/components/schemas/TrustXLocale'
          description: The user's locale. The default locale configured at the store level.
        timezone:
          type: string
          description: The user's timezone. The default timezone configured at the store level.
          example: Europe/London
        firstName:
          type: string
          description: The user's first name.
        lastName:
          type: string
          description: The user's last name.
        email:
          type: string
          description: The user's email address.
        dateOfBirth:
          type: string
          format: date
          description: The user's date of birth.
        nationalities:
          type: array
          description: A list of nationalities associated with the user.
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: object
          description: "A list of attributes associated with the user.\n\nOne attribute, which is set **internally** by the server on a user during passkey registration, is `passkeyUsers`. A specific user handle may be provided via the passkey registration request, if not it is set to a random ID when the first passkey is created for the user. The attribute value looks like this:.\n\n```\"passkeyUsers\": {\n  \"{relyingPartyId}\": {\n    \"USER_HANDLE\":\"{passkey user handle}\"\n  }\n} \n```"
        summaryInfo:
          $ref: '#/components/schemas/UserDtoSummaryInfo'
          description: Summary information about items registered to the user.
        locks:
          $ref: '#/components/schemas/UserLocks'
          description: User lock information.
        lockedUntilDtm:
          type: string
          format: date-time
          description: If the user is currently locked, this is the time at which the lock will end.
        lastAuthenticatedDtm:
          type: string
          format: date-time
          description: If the user has been authenticated, this is the time at which they were last authenticated.
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
    PasskeySummary:
      type: object
      description: Summary information about a passkey registered to the user.
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        aaguid:
          type: string
          description: A unique identifier of the passkey type.
        credentialId:
          type: string
          description: A unique identifier of the particular passkey credential.
        status:
          type: string
          description: The status of the passkey.
          enum:
          - ACTIVE
          - DISABLED
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this passkey has not been used for authentication then this field is not present.
        name:
          type: string
          description: The name of the passkey supplied when the passkey was registered.
    UserLocks:
      type: object
      description: 'User lock information.


        Describes locks at the user level and modality level. A user can have escalating temporary locks which come into effect after a certain number of consecutive authentication attempts. The number of locks and the lock durations are configured at the store level.


        **NOTE**: Currently only user-level locking is supported with modality level locking planned for a later release.'
      properties:
        lockCounter:
          type: integer
          format: int32
          description: The number of consecutive locks tagged for this user.
        tempLockedAt:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock came into effect.
        tempLockedUntil:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock ends.
        lockedAt:
          type: string
          format: date-time
          description: If the user is *permanently* locked then this is the time at which the lock came into effect.
        userModalityLocks:
          type: array
          description: 'Locking information related to particular authentication modalities.


            **Not supported in this release**'
          items:
            $ref: '#/components/schemas/UserModalityLock'
    PasscodeSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        policyName:
          type: string
          description: Identifies the identity store passcode policy.
        status:
          type: string
          description: The status of the user passcode.
          enum:
          - ACTIVE
          - DISABLED
        lastRenewedDtm:
          type: string
          format: date-time
          description: The last time the passcode was renewed. Only present if a renewal has occurred.
        expirationDate:
          type: string
          format: date
          description: Expiration date for a passcode. Only required if regular renewals are enforced.
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this passcode has not been used for authentication then this field is not present.
    StartTOTPRegistrationResponse:
      type: object
      description: A response structure returned from create TOTP registration call, returning QR code string to be scanned with Authenticator App.
      properties:
        qrCodeString:
          type: string
          description: An oauth totp formatted string, generated for QR code scanned by Authenticator App.
        secret:
          type: string
          description: Base32 String of mutual secret used by both server and Authenticator App when generating OTP.
        userTOTP:
          $ref: '#/components/schemas/UserTOTP'
        user:
          $ref: '#/components/schemas/UserDto'
    TOTPSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        status:
          type: string
          description: The status of the user TOTP.
          enum:
          - ACTIVE
          - PENDING
          - DISABLED
        issuer:
          type: string
          description: The issuer of the user TOTP.
        username:
          type: string
          description: The user name label used for registering TOTP.
        policyName:
          type: string
          description: TOTP Policy name
        algorithm:
          type: string
          description: The algorithm used to validate the authentication code.
        activatedDtm:
          type: string
          format: date-time
          description: Date and time of the TOTP activation - this is time when first auth with TOTP happened and marked TOTP as active.
        expirationDtm:
          type: string
          format: date-time
          description: Expiration dtm for the pending TOTPs - this is time before which is possible to activate pending TOTP.
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this TOTP has not been used for authentication then this field is not present.
    UserTOTP:
      type: object
      description: 'A user TOTP record, created for every TOTP registration and updated with TOTP authentications.


        '
      properties:
        permittedOperations:
          type: array
          items:
            type: string
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        id:
          type: string
          description: Unique 26-character database user ID.
        storeId:
          type: string
          description: Unique 26-character database store ID.
        userId:
          type: string
          description: Unique 26-character database user ID.
        status:
          type: string
          description: 'The totp status: ACTIVE, PENDING or DISABLED.'
          enum:
          - ACTIVE
          - PENDING
          - DISABLED
        username:
          type: string
          description: Username for TOTP registration - used as a label in Authenticator App and identifies the account holder. Mandatory.
        policyName:
          type: string
          description: The TOTP policy name, used as a key in TOTP policies map in store configuration.
        algorithm:
          type: string
          description: The algorithm used to validate the authentication code. All of the algorithms from TOTP Policy will be tried and if one works, it will be set as the algorithm to TOTP record during complete TOTP registration process.
        issuer:
          type: string
          description: Issuer string, used as an identifier in Authenticator App, together with username from TOTP registration request. Optional, but highly recommended.
        secret:
          type: string
          description: The shared secret for TOTP
        lastUsedDtm:
          type: string
          format: date-time
          description: If the TOTP has been used for authentication this field indicates the last time this occurred
        expirationDtm:
          type: string
          format: date-time
          description: Expiration dtm for the pending TOTPs - this is time before which is possible to activate pending TOTP.
        activatedDtm:
          type: string
          format: date-time
          description: Date and time of the TOTP activation - this is time when first auth with TOTP happened and marked TOTP as active.
        typeId:
          type: string
      required:
      - id
      - policyName
      - secret
      - status
      - storeId
      - userId
      - username
    TOTPValidationResult:
      type: object
      description: A response structure for validating TOTP, returned from complete totp registration and totp authentication calls.
      properties:
        userTOTP:
          $ref: '#/components/schemas/UserTOTP'
        user:
          $ref: '#/components/schemas/UserDto'
    AppkeySummary:
      type: object
      description: 'Summary information about an appkey registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        deviceId:
          type: string
          description: 'A unique identifier of the device on which the appkey is installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        deviceOs:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device make and model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceName:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        rpId:
          type: string
          description: The relying party ID.
        aaid:
          type: string
          description: A unique identifier of the appkey type.
        keyId:
          type: string
          description: A unique identifier of the particular appkey credential.
        status:
          type: string
          description: The status of the appkey.
          enum:
          - ACTIVE
          - DISABLED
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this appkey has not been used for authentication then this field is not present.
    DeviceSummary:
      type: object
      description: 'Summary information about a device containing keys registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: 'A unique identifier of the device on which the keys are installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        rpId:
          type: string
          description: The relying party ID.
        os:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        name:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        keys:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AppkeySummary'
          description: 'A map of appkey types to list of key summary information where the key types are:

            - **DEVICE**: A device appkey which authenticates the device without user input.

            - **BIOMETRIC**: A biometric appkey which authenticates the user using a biometric.

            List is here to support "more than one app keys of the same type" concept, but in most cases we expect the size of it will be one.'
    StartTOTPRegRequest:
      type: object
      description: A request structure for create TOTP registration call and creating pending TOTP registration.
      properties:
        username:
          type: string
          description: A mandatory username used as a label in Authenticator App.
          minLength: 1
      required:
      - username
    UserDtoSummaryInfo:
      type: object
      description: Summary information about items registered to the user such as biometrics, device keys and passkeys.
      properties:
        biometrics:
          type: array
          items:
            $ref: '#/components/schemas/BiometricSummary'
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeySummary'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSummary'
        totps:
          type: array
          items:
            $ref: '#/components/schemas/TOTPSummary'
        passcodes:
          type: array
          items:
            $ref: '#/components/schemas/PasscodeSummary'
    UpdateTOTPStatusRequest:
      type: object
      description: A request structure for updating user TOTP record status.
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - DISABLED
      required:
      - status
    UserModalityLock:
      type: object
      description: 'Modality lock information.


        Describes locks at the modality level. A modality can have escalating temporary locks which come into effect after a certain number of consecutive authentication attempts. The number of locks and the lock durations are configured at the store level.


        **NOTE**: Currently only user-level locking is supported with modality level locking planned for a later release.'
      properties:
        lockCounter:
          type: integer
          format: int32
          description: The number of consecutive locks tagged for this modality.
        tempLockedAt:
          type: string
          format: date-time
          description: If the modality is *temporarily* locked then this is the time at which the lock came into effect.
        tempLockedUntil:
          type: string
          format: date-time
          description: If the modality is *temporarily* locked then this is the time at which the lock ends.
        lockedAt:
          type: string
          format: date-time
          description: If the modality is *permanently* locked then this is the time at which the lock came into effect.
        type:
          type: string
          description: The modality type, for example `Face`.
    IdStoreSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    TrustXLocale:
      type: object
      description: Locale information. Exposes the language, country and variant locale components, for example `en_US_UNIX` contains these components as `en`, `US` and `UNIX` respectively.
      properties:
        language:
          type: string
          description: The mandatory locale language component
        country:
          type: string
          description: The optional locale country component
        variant:
          type: string
          description: The optional locale variant component
    TOTPValidationRequest:
      type: object
      description: A request structure for validating TOTP, used for complete totp registration and totp authentication calls.
      properties:
        authenticationCode:
          type: string
          description: Code provided by authenticator and entered by user.
        stepsAllowed:
          type: integer
          format: int32
          description: Number defining for how many periods before the current period code will be generated and checked against submitted code.
    BiometricSummary:
      type: object
      description: Summary information about a biometric registered to the user.
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        type:
          type: string
          description: The biometric type, for example `Face`
        subtype:
          type: string
          description: The biometric subtype, for example an algorithm identifier like `DFV6E`
        status:
          type: string
          description: The biometric status
          enum:
          - PARTIAL_ENROLLMENT
          - ACTIVE
          - DISABLED
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this biometric has not been used for authentication then this field is not present.
  securitySchemes:
    BearerAuth:
      type: http
      description: Access to the APIs is restricted by bearer auth
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      description: An API key is required to create a token
      name: X-Api-Key
      in: header
