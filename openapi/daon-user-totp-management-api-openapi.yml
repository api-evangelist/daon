openapi: 3.2.0
info:
  title: Daon User TOTP Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User TOTP Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User TOTP Management
paths:
  /api/identity-store/stores/{storeName}/users/{userExtId}/totps/{id}/ext:
    get:
      tags:
      - User TOTP Management
      summary: Get a TOTP for a user identified by external ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getUserTOTPByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getUserTOTPByExtUserId`'
      operationId: getUserTOTPByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the TOTP
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User TOTPs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTOTP'
              example:
                id: 7NWPL7KIMGAPSXKTP4TRHNTPXM
                storeId: V4HY243RDEQJMT62OF6I7VVFQE
                userId: M5CKIGYEK7FWGD76ZY3D7Q6X6U
                policyName: totpPolicy1
                issuer: skydev1.oak.trustx-dev.com
                username: TestingTOTP
                createdDtm: {}
                lastUpdatedDtm: {}
                lastUsedDtm: {}
                expirationDtm: {}
                activatedDtm: {}
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2512**: TOTP not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getUserTOTPByExtUserId
    post:
      tags:
      - User TOTP Management
      summary: Update an existing TOTP's status by external user ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:updateUserTOTPStatusByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:updateUserTOTPStatusByExtUserId`'
      operationId: updateUserTOTPStatusByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the TOTP
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The user TOTP update information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTOTPStatusRequest'
        required: true
      responses:
        '200':
          description: User TOTP updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTOTP'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2519**: Status can only be updated from ACTIVE to DISABLED or DISABLED to ACTIVE.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2512**: TOTP not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:updateUserTOTPStatusByExtUserId
    delete:
      tags:
      - User TOTP Management
      summary: Delete a user TOTP by external user ID and user TOTP ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deleteUserTOTPByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deleteUserTOTPByExtUserId`'
      operationId: deleteUserTOTPByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the User TOTP
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User TOTP deleted successfully
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2512**: TOTP not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deleteUserTOTPByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/totps/registrations/{policyName}:
    get:
      tags:
      - User TOTP Management
      summary: Get TOTP registration for user identified by ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getTOTPForUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getTOTPForUser`'
      operationId: getTOTPForUser
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: policyName
        in: path
        description: TOTP Policy Name
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Active User TOTP Registration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTOTP'
              example:
                qrCodeString: otpauth://totp/4EbKoGedQqyw_bKmAQ5E6g?secret=DQADPGBCGYHREOYB&issuer=Acme%20Bank&period=30&digits=6&algorithm=SHA256
                secret: DQADPGBCGYHREOYB
                userTOTP:
                  id: 7NWPL7KIMGAPSXKTP4TRHNTPXM
                  storeId: V4HY243RDEQJMT62OF6I7VVFQE
                  userId: M5CKIGYEK7FWGD76ZY3D7Q6X6U
                  policyName: totpPolicy1
                  issuer: skydev1.oak.trustx-dev.com
                  username: TestingTOTP
                  createdDtm: {}
                  lastUpdatedDtm: {}
                  lastUsedDtm: {}
                  expirationDtm: {}
                  activatedDtm: {}
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2506**: TOTP policy not found

            - **2518**: TOTP not found by user and policy name

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getTOTPForUser
    post:
      tags:
      - User TOTP Management
      summary: Start a TOTP registration for an existing user identified by its internal ID…
      description: 'This API is to create string to include it into QR code, which will then be presented to users to scan it with their preferred Authenticator App.

        QR code string is a string in specific oauth TOTP format and it''s created based on the params which are defined in TOTP policy - digits, period in seconds, algorithm, issuer and generated secret key. This is the way to provide all useful information to Authenticator App.


        With this action, user TOTP data is stored within the new user TOTP record in database table user_totps, with status pending and expiration dtm set based on the configurable expiration duration.


        If there are some existing TOTPs stored for same user that are still pending but expired, they will be deleted with this call for the user.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:createTOTPRegistrationForUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:createTOTPRegistrationForUser`'
      operationId: createTOTPRegistrationForUser
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: policyName
        in: path
        description: The name of the TOTP policy
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTOTPRegRequest'
        required: true
      responses:
        '201':
          description: TOTP registration started successfully - QR code string created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartTOTPRegistrationResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2510**: TOTP Registration disallowed for non-active user

            - **2513**: The user has reached the maximum number of TOTPs registrations allowed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2506**: TOTP policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:createTOTPRegistrationForUser
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/totps/authentications/{policyName}:
    post:
      tags:
      - User TOTP Management
      summary: Perform TOTP authentication for an existing user identified by its internal ID…
      description: 'For TOTP authentication, API needs to get the authentication code that shows up in Authenticator App for the registered TOTP which is already activated. The code is then checked against code generated for all active user TOTPs (using shared secret stored with every of them). If there is a match for some of them, it''s successful authentication attempt, otherwise it''s an auth failure.

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:authenticateWithTOTPForUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:authenticateWithTOTPForUser`'
      operationId: authenticateWithTOTPForUser
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: policyName
        in: path
        description: The name of the TOTP policy
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPValidationRequest'
        required: true
      responses:
        '200':
          description: TOTP authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPValidationResult'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2516**: Authentication disallowed for non-active user

            - **2505**: There is no active TOTPs for user to use authentication

            - **2520**: TOTP is disabled for user and policy

            - **2515**: TOTP Authentication failed - wrong code supplied

            - **2100**: Authentication disallowed for locked user

            - **2514**: The user has reached the maximum number of TOTPs authenticator allowed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            - **2506**: TOTP policy not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:authenticateWithTOTPForUser
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
