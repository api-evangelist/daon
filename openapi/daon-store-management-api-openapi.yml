openapi: 3.2.0
info:
  title: Daon Store Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged Store Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: Store Management
paths:
  /api/identity-store/stores/{storeName}:
    get:
      tags:
      - Store Management
      summary: Get an existing identity store
      description: 'Retrieve the full configuration of an identity store, including face, voice, user lock, appkey and passkey configurations.

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getStore` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getStore`'
      operationId: getStore
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      responses:
        '200':
          description: Store retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                Response for store created with no configuration data specified:
                  description: The store contains default face, voice authentication and user lock configurations but no appkey or passkey configurations.
                  value:
                    id: IN5XBGG7KWY6S7C6SACRQBRPUE
                    name: store1
                    description: a user store
                    configuration:
                      defaultUserLocale: en_US
                      defaultUserTimezone: US/Eastern
                      defaultUserStatus: ACTIVE
                      faceAuthenticationConfig:
                        storeAudit: true
                        auditDuration: PT720H
                      voiceAuthenticationConfig:
                        storeAudit: false
                        auditDuration: P30D
                        auditRawAuthenticationData: false
                        storeRawEnrolmentData: false
                        sessionDuration: PT5M
                        tiConfig:
                          supportedServices:
                          - algorithm: DVASVTI5
                            minSpeechEnrol: 15
                            minSpeechVerify: 5
                            continuityThresholdEnrol: 0.5
                            continuityMergeThresholdEnrol: 0.1
                            continuityMergeDurationEnrol: 0
                            continuityThresholdVerify: 0.5
                            continuityMergeThresholdVerify: 0.1
                            continuityMergeDurationVerify: 0
                            verificationScoreThresholds:
                              defaultLocale: en
                              values:
                                en:
                                - enrolmentSpeechSeconds: 15
                                  verificationSpeechSeconds: 5
                                  threshold: 0.5
                      userLockConfig:
                        externalLockManagement: false
                        tempLockDurations:
                        - PT5M
                        - PT5M
                        invalidCountsBeforeTempLock:
                        - 3
                        - 6
                        - 9
                        mode: USER_ONLY
                    createdDtm: {}
                    lastUpdatedDtm: {}
                    createdBy: System
                    lastUpdatedBy: System
                Response with example appkey and passkey config entries:
                  description: There are specific CRUD operations for appkey and passkey configurations. Refer to the Daon documentation for examples of appkey, passkey and voice authentication configurations to support typical use-cases.
                  value:
                    id: TYVETFPJRYHJHMTM2CHSGHSUPI
                    name: store1
                    configuration:
                      defaultUserLocale: en_US
                      defaultUserTimezone: US/Eastern
                      defaultUserStatus: ACTIVE
                      faceAuthenticationConfig:
                        storeAudit: true
                        auditDuration: PT720H
                      voiceAuthenticationConfig:
                        storeAudit: false
                        auditDuration: P30D
                        auditRawAuthenticationData: false
                        storeRawEnrolmentData: false
                        sessionDuration: PT5M
                        tiConfig:
                          supportedServices:
                          - algorithm: DVASVTI5
                            minSpeechEnrol: 15
                            minSpeechVerify: 5
                            continuityThresholdEnrol: 0.5
                            continuityMergeThresholdEnrol: 0.1
                            continuityMergeDurationEnrol: 0
                            continuityThresholdVerify: 0.5
                            continuityMergeThresholdVerify: 0.1
                            continuityMergeDurationVerify: 0
                            verificationScoreThresholds:
                              defaultLocale: en
                              values:
                                en:
                                - enrolmentSpeechSeconds: 15
                                  verificationSpeechSeconds: 5
                                  threshold: 0.5
                      userLockConfig:
                        externalLockManagement: false
                        tempLockDurations:
                        - PT5M
                        - PT5M
                        invalidCountsBeforeTempLock:
                        - 3
                        - 6
                        - 9
                        mode: USER_ONLY
                      passkeyRelyingParties:
                        www.passkeys.io:
                          rpId: www.passkeys.io
                          name: www.passkeys.io
                          registrationPolicies:
                            default:
                              authenticatorSelectionCriteria:
                                authenticatorAttachment: platform
                                requireResidentKey: false
                                userVerification: required
                              attestation: none
                              credProtect:
                                credentialProtectionPolicy: userVerificationOptional
                                enforceCredentialProtectionPolicy: false
                              fullAuditingRequired: true
                              externalChallengeAllowed: true
                              sessionManagementExternal: true
                              sessionDuration: PT5M
                          authenticationPolicies:
                            default:
                              userVerification: required
                              auditLevel: FULL
                              externalChallengeAllowed: true
                              sessionManagementExternal: false
                              sessionDuration: PT5M
                            noAudit:
                              userVerification: required
                              auditLevel: NONE
                              externalChallengeAllowed: true
                              sessionManagementExternal: false
                              sessionDuration: PT5M
                      appkeyRelyingParties:
                        www.appkeys.io:
                          rpId: www.appkeys.io
                          name: www.appkeys.io
                          trustedFacets:
                            version:
                              major: 1
                              minor: 0
                            ids:
                            - https://www.daon_test_rp.com
                          registrationPolicies:
                            default:
                              fidoPolicy:
                                accepted:
                                - - aaid:
                                    - D409#0602
                              extensions:
                              - DEVICE_INFO
                              - HEALTH_CHECK
                              - ENVIRONMENT_CHECK
                              externalChallengeAllowed: true
                              sessionManagementExternal: true
                              sessionDuration: PT5M
                              fullAuditingRequired: false
                          authenticationPolicies:
                            default:
                              fidoPolicy:
                                accepted:
                                - - aaid:
                                    - D409#0602
                              extensions:
                              - DEVICE_INFO
                              - HEALTH_CHECK
                              - ENVIRONMENT_CHECK
                              externalChallengeAllowed: true
                              sessionManagementExternal: false
                              sessionDuration: PT5M
                              auditLevel: FULL
                    createdDtm: {}
                    lastUpdatedDtm: {}
                    createdBy: System
                    lastUpdatedBy: System
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getStore
    post:
      tags:
      - Store Management
      summary: Update an existing identity store
      description: 'Update the name, description and optionally configuration of an identity store.


        **NOTE 1** It is highly recommended *not* to update the store name after creation as it is used as a reference for various APIs and audited data.


        **NOTE 2** Refer to Daon documentation for recommended configuration options, especially for appkeys, passkey and voice authentication configurations as these are complex.


        The `voiceAuthenticationConfig` section uses **opt-in semantics on update**:

        * Omit the field (or send it as `null`) to leave the persisted voice configuration unchanged. This applies to all stores: an update that omits `voiceAuthenticationConfig` never modifies the persisted voice settings, regardless of whether voice was previously configured. For stores created before voice support was added, this means voice will remain unconfigured and voice endpoints will continue to return `VOICE_AUTHENTICATION_NOT_CONFIGURED_FOR_STORE`.

        * Send `"voiceAuthenticationConfig": {}` to enable voice with all server-side defaults. This is the recommended way to enable voice on a pre-existing store after upgrading to a version that supports voice.

        * Send a populated `voiceAuthenticationConfig` to set or override specific values. Any field that is omitted within the supplied configuration (`storeAudit`, `auditDuration`, `auditRawAuthenticationData`, `storeRawEnrolmentData`, `sessionDuration`, `tiConfig`) will be filled with the corresponding server default.


        When updating TI voice services, the `onServiceUpdate` behaviour controls how existing enrolments are handled (e.g. continuing partial enrolments with legacy service, auto re-enrolment on authenticate).

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:updateStore` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:updateStore`'
      operationId: updateStore
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The store to update. Omit `voiceAuthenticationConfig` to leave the persisted voice configuration unchanged; send `{}` to enable voice with server defaults; or send a populated object to set specific values (omitted object-typed fields are filled with server defaults).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
            example:
              name: store1
              description: Updated test store description
              attributeSchema: null
              configuration:
                voiceAuthenticationConfig:
                  storeAudit: true
                  auditDuration: P45D
                  auditRawAuthenticationData: false
                  storeRawEnrolmentData: false
                  sessionDuration: PT10M
                  tiConfig:
                    onServiceUpdate:
                      continuePartialEnrolmentsUsingLegacyService: true
                    supportedServices:
                    - algorithm: DVASVTI5
                      minSpeechEnrol: 20
                      minSpeechVerify: 10
                      continuityThresholdEnrol: 0.5
                      continuityMergeThresholdEnrol: 0.1
                      continuityMergeDurationEnrol: 0
                      continuityThresholdVerify: 0.5
                      continuityMergeThresholdVerify: 0.1
                      continuityMergeDurationVerify: 0
                      verificationScoreThresholds:
                        defaultLocale: en
                        values:
                          en:
                          - enrolmentSpeechSeconds: 20
                            verificationSpeechSeconds: 10
                            threshold: 0.5
        required: true
      responses:
        '200':
          description: Store updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              example:
                id: IN5XBGG7KWY6S7C6SACRQBRPUE
                name: store1
                description: Updated test store description
                configuration:
                  defaultUserLocale: en_US
                  defaultUserTimezone: US/Eastern
                  defaultUserStatus: ACTIVE
                  faceAuthenticationConfig:
                    storeAudit: true
                    auditDuration: PT720H
                  voiceAuthenticationConfig:
                    storeAudit: true
                    auditDuration: P45D
                    auditRawAuthenticationData: false
                    storeRawEnrolmentData: false
                    sessionDuration: PT10M
                    tiConfig:
                      onServiceUpdate:
                        continuePartialEnrolmentsUsingLegacyService: true
                      supportedServices:
                      - algorithm: DVASVTI5
                        minSpeechEnrol: 20
                        minSpeechVerify: 10
                        continuityThresholdEnrol: 0.5
                        continuityMergeThresholdEnrol: 0.1
                        continuityMergeDurationEnrol: 0
                        continuityThresholdVerify: 0.5
                        continuityMergeThresholdVerify: 0.1
                        continuityMergeDurationVerify: 0
                        verificationScoreThresholds:
                          defaultLocale: en
                          values:
                            en:
                            - enrolmentSpeechSeconds: 20
                              verificationSpeechSeconds: 10
                              threshold: 0.5
                  userLockConfig:
                    externalLockManagement: false
                    tempLockDurations:
                    - PT5M
                    - PT5M
                    invalidCountsBeforeTempLock:
                    - 3
                    - 6
                    - 9
                    mode: USER_ONLY
                createdDtm: {}
                lastUpdatedDtm: {}
                createdBy: System
                lastUpdatedBy: System
        '400':
          description: 'An error occurred. Possible error codes:

            - **102**: A store with a duplicate name exists

            - **104**: Store name not provided

            - **107**: The invalid counts before locking must be provided

            - **108**: The invalid counts values must ascend

            - **109**: The number of temporary lock durations must be one less than the number of temporary lock counts

            - **110**: Each temporary lock duration must be provided

            - **2300**: The relying party ID is not secure

            - **3000**: No TI voice services configured

            - **3001**: Unsupported TI voice service algorithm

            - **3002**: Invalid minimum speech for enrolment (must be > 0)

            - **3003**: Invalid minimum speech for verification (must be > 0)

            - **3004**: Invalid continuity threshold for enrolment (must be 0-1)

            - **3005**: Invalid continuity merge threshold for enrolment (must be 0-1)

            - **3006**: Invalid continuity merge duration for enrolment (must be >= 0)

            - **3007**: Invalid continuity threshold for verification (must be 0-1)

            - **3008**: Invalid continuity merge threshold for verification (must be 0-1)

            - **3009**: Invalid continuity merge duration for verification (must be >= 0)

            - **3010**: Default locale must be specified in ASV verification score thresholds

            - **3011**: No locale-specific ASV verification score thresholds specified

            - **3012**: Default locale does not have corresponding ASV thresholds

            - **3013**: No ASV verification score thresholds specified for locale

            - **3014**: Invalid enrolment speech seconds in ASV threshold (must be > 0)

            - **3015**: Invalid verification speech seconds in ASV threshold (must be > 0)

            - **3016**: Invalid ASV verification score threshold (must be 0-1)

            - **3017**: No ASV verification score thresholds specified

            - **3018**: Invalid voice TI thresholds configuration

            - **3019**: No voice matching algorithm specified

            - **3023**: Invalid voice authentication session duration (must be > 0)

            - **3057**: Invalid maximum speech for verification (must be >= minimum speech when set > 0)

            - **20125**: The face matching threshold must be between 0 and 1

            - **20126**: The internal face matching threshold must be between 0 and 1

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '90'
                message: The specified tenant could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:updateStore
    delete:
      tags:
      - Store Management
      summary: Delete an existing store
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deleteStore` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deleteStore`'
      operationId: deleteStore
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      responses:
        '200':
          description: Store deleted successfully
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deleteStore
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores:
    get:
      tags:
      - Store Management
      summary: List stores
      description: 'Return a paged list of stores which can be filtered by store name.

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listStores` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listStores`'
      operationId: listStores
      parameters:
      - name: name
        in: query
        description: Store name filter (supports wildcard search).
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: '%'
      - name: page
        in: query
        description: The page number.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The page size.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: Sorting parameter. Default ascending by ID. **Should not be changed as there will be very few stores per tenant**
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: Stores retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStoreSearchDto'
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '90'
                message: The specified tenant could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listStores
    post:
      tags:
      - Store Management
      summary: Create a new identity store
      description: 'Creates an identity store with a name and optional description and configuration.


        A newly created identity store is ready to store users. The configuration must contain relevant sections for biometrics, voice authentication, appkeys and passkeys to support these abilities.


        If no configuration is provided, a default configuration will be created with default face, voice authentication and user lock settings.


        The `voiceAuthenticationConfig` section configures text-independent (TI) voice authentication. It includes audit settings, session duration and a list of supported TI voice services (e.g. DVASVTI5) with algorithm-specific parameters such as minimum speech durations, continuity thresholds, and locale-specific ASV verification score thresholds.


        **NOTE** Refer to Daon documentation for recommended configuration options, especially for appkeys, passkey and voice authentication configurations as these are complex.

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:addStore` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:addStore`'
      operationId: addStore
      parameters: []
      requestBody:
        description: The store to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store'
            example:
              name: store1
              description: My test store
        required: true
      responses:
        '201':
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              example:
                id: IN5XBGG7KWY6S7C6SACRQBRPUE
                name: store1
                description: My test store
                configuration:
                  defaultUserLocale: en_US
                  defaultUserTimezone: US/Eastern
                  defaultUserStatus: ACTIVE
                  faceAuthenticationConfig:
                    storeAudit: true
                    auditDuration: PT720H
                  voiceAuthenticationConfig:
                    storeAudit: false
                    auditDuration: P30D
                    auditRawAuthenticationData: false
                    storeRawEnrolmentData: false
                    sessionDuration: PT5M
                    tiConfig:
                      supportedServices:
                      - algorithm: DVASVTI5
                        minSpeechEnrol: 15
                        minSpeechVerify: 5
                        continuityThresholdEnrol: 0.5
                        continuityMergeThresholdEnrol: 0.1
                        continuityMergeDurationEnrol: 0
                        continuityThresholdVerify: 0.5
                        continuityMergeThresholdVerify: 0.1
                        continuityMergeDurationVerify: 0
                        verificationScoreThresholds:
                          defaultLocale: en
                          values:
                            en:
                            - enrolmentSpeechSeconds: 15
                              verificationSpeechSeconds: 5
                              threshold: 0.5
                  userLockConfig:
                    externalLockManagement: false
                    tempLockDurations:
                    - PT5M
                    - PT5M
                    invalidCountsBeforeTempLock:
                    - 3
                    - 6
                    - 9
                    mode: USER_ONLY
                createdDtm: {}
                lastUpdatedDtm: {}
                createdBy: System
                lastUpdatedBy: System
        '400':
          description: 'An error occurred. Possible error codes:

            - **101**: Max number of stores reached for this tenant

            - **102**: A store with a duplicate name exists

            - **104**: Store name not provided

            - **107**: The invalid counts before locking must be provided

            - **108**: The invalid counts values must ascend

            - **109**: The number of temporary lock durations must be one less than the number of temporary lock counts

            - **110**: Each temporary lock duration must be provided

            - **2300**: The relying party ID is not secure

            - **3000**: No TI voice services configured

            - **3001**: Unsupported TI voice service algorithm

            - **3002**: Invalid minimum speech for enrolment (must be > 0)

            - **3003**: Invalid minimum speech for verification (must be > 0)

            - **3004**: Invalid continuity threshold for enrolment (must be 0-1)

            - **3005**: Invalid continuity merge threshold for enrolment (must be 0-1)

            - **3006**: Invalid continuity merge duration for enrolment (must be >= 0)

            - **3007**: Invalid continuity threshold for verification (must be 0-1)

            - **3008**: Invalid continuity merge threshold for verification (must be 0-1)

            - **3009**: Invalid continuity merge duration for verification (must be >= 0)

            - **3010**: Default locale must be specified in ASV verification score thresholds

            - **3011**: No locale-specific ASV verification score thresholds specified

            - **3012**: Default locale does not have corresponding ASV thresholds

            - **3013**: No ASV verification score thresholds specified for locale

            - **3014**: Invalid enrolment speech seconds in ASV threshold (must be > 0)

            - **3015**: Invalid verification speech seconds in ASV threshold (must be > 0)

            - **3016**: Invalid ASV verification score threshold (must be 0-1)

            - **3017**: No ASV verification score thresholds specified

            - **3018**: Invalid voice TI thresholds configuration

            - **3019**: No voice matching algorithm specified

            - **3023**: Invalid voice authentication session duration (must be > 0)

            - **3057**: Invalid maximum speech for verification (must be >= minimum speech when set > 0)

            - **20125**: The face matching threshold must be between 0 and 1

            - **20126**: The internal face matching threshold must be between 0 and 1

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '90'
                message: The specified tenant could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:addStore
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/stats:
    get:
      tags:
      - Store Management
      summary: Get store event statistics
      description: 'Returns a cumulative count of operations performed on this store on the requested data.

        For details of how stats data is populated for different types of store event, refer to Daon documentation

        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:getStoreStats` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:getStoreStats`'
      operationId: getStoreStats
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: date
        in: query
        description: 'The date of the request. Default: null which returns today''s statistics.'
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Store stats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/StoreStat'
              example:
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: user_added
                counter: 1
                createdDtm: {}
                lastUpdatedDtm: {}
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: user_deleted
                counter: 1
                createdDtm: {}
                lastUpdatedDtm: {}
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: appkey_deleted
                counter: 2
                createdDtm: {}
                lastUpdatedDtm: {}
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: appkey_added
                qual1: android
                qual2: DEVICE
                counter: 2
                createdDtm: {}
                lastUpdatedDtm: {}
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: appkey_authentication_success
                qual1: android
                qual2: DEVICE
                counter: 100
                createdDtm: {}
                lastUpdatedDtm: {}
              - storeId: WGFS7H3A5Y6TN5WPRBG4BPFTG4
                name: store_added
                counter: 1
                createdDtm: {}
                lastUpdatedDtm: {}
        '400':
          description: 'An error occurred. Possible error codes:

            - **105**: A daily report for the provided date was not found

            - **106**: The daily report for the provided date could not be retrieved

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:getStoreStats
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
components:
  schemas:
    ASVVerificationScoreThresholds:
      type: object
      description: ASV threshold configuration. Different thresholds can be set for different locales. If a locale does not have a specific value, the `defaultLocale` value will be used.
      properties:
        defaultLocale:
          type: string
          description: The default locale for which the threshold values apply which *must* be specified in the `values` map. If a locale does not have a specific value, the `defaultLocale` value will be used.
        values:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ASVThreshold'
          description: A map of locales to ASV thresholds. The key is the locale and the value is the ASV threshold values for that locale. Multiple thresholds for different amounts of speech captured during voice enrolment or verification can be specified.
    AuthenticationPolicy:
      type: object
      description: A relying party's passkey authentication policy
      properties:
        userVerification:
          type: string
          description: 'Defines whether user verification is required on the authenticator.


            **For ease of use this should be set to `preferred`**'
          enum:
          - required
          - preferred
          - discouraged
        auditLevel:
          type: string
          description: Defines the level of auditing, none, fail-only or always.
          enum:
          - NONE
          - FAILED_ONLY
          - ALL
        auditDuration:
          type: string
          default: 30 days or whatever number is configured as `default.max.audit.retention.days`
          description: How long to store the audit file. The value is a duration string.
          example: P30D
        hints:
          type: array
          description: Zero or more hints to guide the user agent in interacting with the user during authentication. Hints are ordered by decreasing preference and are not requirements. See the webauthn specification for details.
          items:
            type: string
            description: "Hints to guide the user agent in interacting with the user during registration or authentication. Hints are not requirements and do not bind the user agent. They are provided in order of decreasing preference. Possible values: \n- **security-key**: The relying party believes that users will satisfy this request with a physical security key.\n- **client-device**: The relying party believes that users will satisfy this request with a platform authenticator attached to the client device.\n- **hybrid**: The relying party believes that users will satisfy this request with general-purpose authenticators such as smartphones."
            enum:
            - security-key
            - client-device
            - hybrid
        externalChallengeAllowed:
          type: boolean
          default: false
          description: If `true` then the user may supply the authentication challenge, otherwise it is generated randomly by the Identity Store service.
        sessionManagementExternal:
          type: boolean
          default: false
          description: If `true` then the authentication session data is managed by the customer. It is returned to the customer when a authentication request is generated and must be supplied back to the server when authentication is completed. If `false` then the authentication session data is managed by the server. A session ID is returned with the authentication request which must be supplied back to the server when authentication is completed. The session has a limited lifetime which can be configured via  `sessionDuration`.
        sessionDuration:
          type: string
          description: 'The session lifetime. The value is a duration string.


            **This value is mandatory if `sessionManagementExternal` is `false` (the default).**


            **NOTE**: Session data is cached in memory so as short a value as possible is recommended.'
          example: PT5M
      required:
      - auditLevel
      - userVerification
    RegularExpression:
      type: object
      properties:
        regularExpression:
          type: string
        tag:
          type: string
    ApnsConfig:
      type: object
      properties:
        appBundleId:
          type: string
          description: The bundle identifier of iOS app.
        teamId:
          type: string
          description: Apple Developer Team ID. Required for generating JWT tokens when using APNs token-based authentication.
        keyId:
          type: string
          description: The Key ID associated with your APNs authentication key (.p8 file). Used in the JWT header for APNs requests.
        sandboxEnabled:
          type: boolean
          description: Flag that indicates whether to use the APNs sandbox or production environment.
        soundEnabled:
          type: boolean
          description: Flag that indicates whether to push notification with or without sound.
        tokenSigningKey:
          type: string
          description: The private key content from APNs .p8 file. This key is used to sign the JWT for token-based authentication with APNs.
        tokenSigningKeyEnc:
          type: string
          description: An encrypted authentication token signing key provided from .p8 file for storing in db.
    ModalityLockConfig:
      type: object
      description: Lock configuration specific to a modality, for example face or voice.
      properties:
        externalLockManagement:
          type: boolean
          default: false
          description: If `true` then user locking is managed externally by the customer. Users are not automatically locked as the result of authentications.
        tempLockDurations:
          type: array
          description: 'How long to lock the user for each temporary lock escalation. Each value is a duration string.

            For example: to lock for 5 minutes after 3 attempts, 10 minutes after 6 attempts and lock permanently after 9 attempts. Set `invalidCountsBeforeTempLock` to `{3,6,9}` and `tempLockDurations` to `{"PT5M","PT10M"}`'
          example:
          - PT5M
          - PT10M
          items:
            type: string
            example: PT2H30M
        invalidCountsBeforeTempLock:
          type: array
          description: 'How many invalid attempts are required to escalate a temporary lock. When the lock count reaches the final value the user is locked permanently.

            For example: to lock for 5 minutes after 3 attempts, 10 minutes after 6 attempts and lock permanently after 9 attempts. Set `invalidCountsBeforeTempLock` to `{3,6,9}` and `tempLockDurations` to `{"PT5M","PT10M"}`'
          example:
          - 3
          - 6
          - 9
          items:
            type: integer
            format: int32
        type:
          type: string
          description: The type of modality, for example `Face`.
      required:
      - tempLockDurations
      - type
    JsonNullableMapStringObject:
      type: object
      properties:
        undefined:
          type: boolean
        present:
          type: boolean
    ASVThreshold:
      type: object
      description: ASV verification score thresholds for different amounts of speech captured during voice enrolment or verification
      properties:
        enrolmentSpeechSeconds:
          type: integer
          format: int32
          description: The amount of speech captured during enrolment in seconds
        verificationSpeechSeconds:
          type: integer
          format: int32
          description: The amount of speech captured during verification in seconds
        threshold:
          type: number
          format: double
          description: The ASV threshold which must be met or exceeded for the operation to succeed. This value must be between 0.0 and 1.0 inclusive.
    CredProtect:
      type: object
      description: 'Defines the level of protection required for registered credentials.


        **See field descriptions for recommended values.**'
      properties:
        credentialProtectionPolicy:
          type: string
          description: 'Defines the credential protection policy


            **For ease of use this should be set to `userVerificationOptional`**'
          enum:
          - userVerificationOptional
          - userVerificationOptionalWithCredentialIDList
          - userVerificationRequired
        enforceCredentialProtectionPolicy:
          type: boolean
          description: 'Whether to enforce the credential protection policy


            **For ease of use this should be set to `null`**'
      required:
      - credentialProtectionPolicy
      - enforceCredentialProtectionPolicy
    FaceMatchingProcessesData:
      type: object
      default: DFV6`
      description: The list of matching algorithms to be run in preferred order based on data availability.
      example:
      - transformAlgorithm: DFV6E
        minConfidence: 3
        internalScore: 0.6
      properties:
        algorithm:
          type: string
          enum:
          - DFV6
          - DFV7
        threshold:
          type: number
          format: double
        internalThreshold:
          type: number
          format: double
    ClientDataRequest:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        evaluationRules:
          $ref: '#/components/schemas/FIDOExtensionEvaluationGroup'
    IdStoreSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    IDSTenant:
      type: object
      description: A TrustX tenant for which a number of identity stores maybe created.
      properties:
        id:
          type: string
          description: Unique mandatory tenant ID. Required on tenant creation.
          maxLength: 64
          minLength: 1
        createdDtm:
          type: string
          format: date-time
          description: Created date time.
        lastUpdatedDtm:
          type: string
          format: date-time
          description: Last updated time.
        nextKeyUpdateDtm:
          type: string
          format: date-time
          description: Time when the next automated data encryption key rollover will take place.
        nextCaKeyUpdateDtm:
          type: string
          format: date-time
          description: Time when the next automated CA root key rollover will take place.
        nextKekUpdateDtm:
          type: string
          format: date-time
          description: Time when the next automated key encryption key rollover will take place.
    StoreConfiguration:
      type: object
      description: Identity Store configuration settings. Contains global settings, user locking configuration and policies for face, appkey and passkey registration and authentication
      properties:
        defaultUserLocale:
          type: string
          default: en_US - retrieved from the `store.default.userLocale` property
          description: The default locale assigned to users created within this store. The value is a locale string in the form of `{language}_{optional country}_{optional variant}`.
        defaultUserTimezone:
          type: string
          default: US/Eastern - retrieved from the `store.default.userTimezone` property
          description: The default timezone assigned to users created within this store. The value is a a standard TZDB timezone string as listed [here](https://github.com/eggert/tz/blob/main/zone.tab).
        defaultUserStatus:
          type: string
          default: ACTIVE
          description: The default status assigned to users created within this store.
          enum:
          - PENDING_ACTIVE
          - ACTIVE
          - TEMP_LOCKED
          - LOCKED
          - DISABLED
        faceAuthenticationConfig:
          $ref: '#/components/schemas/FaceAuthenticationConfig'
          description: Face authentication configuration settings. Required for face authentication.
        voiceAuthenticationConfig:
          $ref: '#/components/schemas/VoiceAuthenticationConfig'
          description: Voice authentication configuration settings. Required for voice authentication.
        userLockConfig:
          $ref: '#/components/schemas/UserLockConfig'
          description: User lock configuration settings. If not supplied, default values are used.
        passkeyRelyingParties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PasskeyRelyingPartyConfig'
          description: Map of passkey configuration keyed by relying party ID. Required for passkey authentication.
        appkeyRelyingParties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppkeyRelyingPartyConfig'
          description: Map of passkey configuration keyed by relying party ID. Required for appkey authentication.
        totpPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TOTPPolicy'
          description: Map of TOTP policies keyed by policy name. Required for TOTP authentication.
        pushNotificationPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PushNotificationPolicy'
          description: Map of Push Notification policies keyed by relying party ID. Required for push notifications.
        passcodePolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PasscodePolicy'
          description: Map of passcode configuration keyed by policy name. Required for passcode authentication.
    FIDOExtensionEvaluationGroup:
      type: object
      properties:
        evaluationType:
          type: string
          enum:
          - ANY_MATCH
          - ALL_MATCH
          - FAIL_IF_ANY
          - FAIL_IF_ALL
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/FIDOExtensionEvaluation'
    StoreStat:
      type: object
      description: 'A statistic about an identity store. For examples how many users have been added to date.

        For examples of how this data is populated for different types of store event, refer to Daon documentation'
      properties:
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        storeId:
          type: string
          description: The unique ID of the store in the database.
        name:
          type: string
          description: Identifies the type of statistic, for example biometric_added, store_deleted, passkey_authentication_success.
        qual1:
          type: string
          description: The first of three possible qualifying pieces of information regarding this statistic, for example the type of an added biometric.
        qual2:
          type: string
          description: The second of three possible qualifying pieces of information regarding this statistic, for example the subtype of an added biometric.
        qual3:
          type: string
          description: The third of three possible qualifying pieces of information regarding this statistic.
        counter:
          type: integer
          format: int64
          description: The cumulative number of events of this type that have taken place to date for this store.
      required:
      - name
      - storeId
    PasskeyRelyingPartyConfig:
      type: object
      description: A relying party's passkey configuration
      properties:
        rpId:
          type: string
          description: The relying party ID.
          maxLength: 255
          minLength: 0
        name:
          type: string
          description: The passkey relying party configuration name.
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: The passkey relying party configuration description.
        restrictedOrigins:
          type: array
          description: 'A list of acceptable origins.

            If supplied, passkey authentications are restricted to these origins.

            If not supplied, passkey authentications are restricted to the relying party ID domain.'
          items:
            type: string
            format: uri
        registrationPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RegistrationPolicy'
          description: "Registration policies keyed by policy name.\nThe policy name must not be more than 20 characters long and \nmust only contain alphanumeric characters and hyphens"
        authenticationPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuthenticationPolicy'
          description: "Authentication policies keyed by policy name.\nThe policy name must not be more than 20 characters long and \nmust only contain alphanumeric characters and hyphens"
      required:
      - authenticationPolicies
      - name
      - registrationPolicies
      - rpId
    PasscodeCriteria:
      type: object
      properties:
        passcodeHistory:
          type: integer
          format: int32
        requiredSymbolCount:
          type: integer
          format: int32
        requiredUpperCaseCount:
          type: integer
          format: int32
        requiredLowerCaseCount:
          type: integer
          format: int32
        requiredDigitCount:
          type: integer
          format: int32
        characterVariety:
          type: integer
          format: int32
        disallowedRegExArray:
          type: array
          items:
            $ref: '#/components/schemas/RegularExpression'
        requiredRegExArray:
          type: array
          items:
            $ref: '#/components/schemas/RegularExpression'
        allowedRegExArray:
          type: array
          items:
            $ref: '#/components/schemas/RegularExpression'
    ASVTIServiceConfig:
      allOf:
      - $ref: '#/components/schemas/BiometricServiceConfig'
      - type: object
        properties:
          minSpeechEnrol:
            type: integer
            format: int32
            description: The minimum amount of speech required for enrolment in seconds
          minSpeechVerify:
            type: integer
            format: int32
            description: The minimum amount of speech required for verification in seconds
          maxSpeechVerify:
            type: integer
            format: int32
            description: Maximum amount of speech that will be used for verification in seconds. If the value is less than or equal to 0 it is ignored. Text independent voice matching will be attempted once minSpeechVerify seconds of audio have been received and the match result will be returned. If the value is greater than 0 it must not be less than minSpeechVerify. Text independent voice matching  will be attempted once minSpeechVerify seconds of audio have been received. If the match succeeds a success result is returned, otherwise verification will continue until the maximum amount of speech has been captured. The verification continues with additional speech so it has a better chance of succeeding eventually.
          continuityThresholdEnrol:
            type: number
            format: double
            description: The continuity threshold for enrolment. Must be between -1.0 and 1.0 inclusive.
          continuityMergeThresholdEnrol:
            type: number
            format: double
            description: The continuity merge threshold for enrolment. Must be between -1.0 and 1.0 inclusive.
          continuityMergeDurationEnrol:
            type: number
            format: double
            description: The continuity merge duration for enrolment
          continuityThresholdVerify:
            type: number
            format: double
            description: The continuity threshold for verification. Must be between -1.0 and 1.0 inclusive.
          continuityMergeThresholdVerify:
            type: number
            format: double
            description: The continuity merge threshold for verification. Must be between -1.0 and 1.0 inclusive.
          continuityMergeDurationVerify:
            type: number
            format: double
            description: The continuity merge duration for verification
          verificationScoreThresholds:
            $ref: '#/components/schemas/ASVVerificationScoreThresholds'
            description: The ASV verification score thresholds for different amounts of speech captured during voice enrolment or verification
      description: ASV TI service configuration
    AppkeyRelyingPartyConfig:
      type: object
      description: A relying party's appkey configuration
      properties:
        rpId:
          type: string
          description: The relying party ID.
          maxLength: 255
          minLength: 0
        name:
          type: string
          description: The appkey relying party configuration name.
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: The appkey relying party configuration description.
        trustedFacets:
          $ref: '#/components/schemas/FIDOTrustedFacets'
          description: A list of trusted appkey origins, typically device application IDs.
        registrationPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppkeyRegistrationPolicy'
          description: "Registration policies keyed by policy name.\nThe policy name must not be more than 20 characters long and \nmust only contain alphanumeric characters and hyphens"
        authenticationPolicies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppkeyAuthenticationPolicy'
          description: "Authentication policies keyed by policy name.\nThe policy name must not be more than 20 characters long and \nmust only contain alphanumeric characters and hyphens"
      required:
      - authenticationPolicies
      - name
      - registrationPolicies
      - rpId
      - trustedFacets
    UserLockConfig:
      type: object
      properties:
        externalLockManagement:
          type: boolean
          default: false
          description: If `true` then user locking is managed externally by the customer. Users are not automatically locked as the result of authentications.
        tempLockDurations:
          type: array
          description: 'How long to lock the user for each temporary lock escalation. Each value is a duration string.

            For example: to lock for 5 minutes after 3 attempts, 10 minutes after 6 attempts and lock permanently after 9 attempts. Set `invalidCountsBeforeTempLock` to `{3,6,9}` and `tempLockDurations` to `{"PT5M","PT10M"}`'
          example:
          - PT5M
          - PT10M
          items:
            type: string
            example: PT2H30M
        invalidCountsBeforeTempLock:
          type: array
          description: 'How many invalid attempts are required to escalate a temporary lock. When the lock count reaches the final value the user is locked permanently.

            For example: to lock for 5 minutes after 3 attempts, 10 minutes after 6 attempts and lock permanently after 9 attempts. Set `invalidCountsBeforeTempLock` to `{3,6,9}` and `tempLockDurations` to `{"PT5M","PT10M"}`'
          example:
          - 3
          - 6
          - 9
          items:
            type: integer
            format: int32
        mode:
          type: string
          default: USER_ONLY
          description: Defines the way user locking operates. **USER_ONLY is the only mode supported for this release.**
          enum:
          - USER_ONLY
          - MODALITY_TO_USER
          - USER_AND_MODALITY
        modalityLockConfigs:
          type: array
          description: Defines locking configuration per modality. **Not supported for this release.**
          items:
            $ref: '#/components/schemas/ModalityLockConfig'
      required:
      - tempLockDurations
    PasscodePolicy:
      type: object
      properties:
        name:
          type: string
          description: The passcode policy name.
          maxLength: 255
          minLength: 1
        description:
          type: string
          description: The passcode policy configuration description.
        minimumLength:
          type: integer
          format: int32
          description: An optional passcode minimum length.
        maximumLength:
          type: integer
          format: int32
          description: An optional passcode maximum length.
        digitCount:
          type: integer
          format: int32
          description: Optional minimum number of digits within the passcode.
        symbolCount:
          type: integer
          format: int32
          description: Optional minimum number of symbols within the passcode.
        lowerCaseCount:
          type: integer
          format: int32
          description: Optional minimum number of lower case characters within the passcode.
        upperCaseCount:
          type: integer
          format: int32
          description: Optional minimum number of upper case characters within the passcode.
        characterVariety:
          type: integer
          format: int32
          description: Optional minimum number of different classes of character that the passcode must contain, where the classes are symbols, digits, upper case and lower case.
        passcodeHistory:
          type: integer
          format: int32
          description: Optional passcode history. A submitted passcode is checked against a configurable number of previously submitted passcodes to see if it matches.
        requiredRegExes:
          type: array
          description: Optional list of required regular expressions, all of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
        allowedRegExes:
          type: array
          description: Optional list of allowed regular expressions, at least one of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
        disallowedRegExes:
          type: array
          description: Optional list of disallowed regular expressions, none of which must be matched for the passcode to be accepted as valid.
          items:
            $ref: '#/components/schemas/PasscodeRegex'
        algorithm:
          type: string
          description: The passcode generation/verification algorithm.
          enum:
          - SRP
        algorithmVariant:
          type: string
          description: The variant of the algorithm used as a user friendly name for a set of algorithm parameters.
        srpAlgorithmParameters:
          $ref: '#/components/schemas/SRPAlgorithmParameters'
          description: SRP algorithm parameters.
        passcodeValidityDuration:
          type: string
          description: Optional passcode validity duration. The value is a duration string. If not supplied the passcode has no expiration date associated with it and therefore does not expire.
          example: PT2H30M
        sessionDuration:
          type: string
          description: 'Session lifetime. The value is a duration string. Defaults to 5 minutes.


            '
          example: PT5M
        auditLevel:
          type: string
          default: NONE
          description: Defines the level of auditing, none, fail-only or always. Defaults to NONE.
          enum:
          - NONE
          - FAILED_ONLY
          - ALL
        auditDuration:
          type: string
          default: 30 days or whatever number is configured as `default.max.audit.retention.days`
          description: How long to store the audit file. The value is a duration string.
          example: P30D
      required:
      - name
    AppkeyRegistrationPolicy:
      type: object
      description: A relying party's appkey registration policy
      properties:
        fidoPolicy:
          $ref: '#/components/schemas/FIDOPolicy'
          description: 'Defines what types of appkey may be used.


            **See Daon documentation for recommended policy settings and the [UAF Protocol Specification](https://fidoalliance.org/specs/fido-uaf-v1.2-ps-20201020/fido-uaf-protocol-v1.2-ps-20201020.html) for details of policy fields.**'
        extensions:
          type: array
          description: 'Defines what types of appkey client SDK extension to use.


            **For optimal support this should be set to `["DEVICE_INFO","HEALTH_CHECK","ENVIRONMENT_CHECK"]`**'
          items:
            type: string
        externalChallengeAllowed:
          type: boolean
          default: false
          description: If `true` then the user may supply the challenge, otherwise it is generated randomly by the Identity Store service.
        sessionManagementExternal:
          type: boolean
          default: false
          description: If `true` then the session data is managed by the customer. It is returned to the customer when a request is generated and must be supplied back to the server when the operation is completed. If `false` then the session data is managed by the server. A session ID is returned with the request which must be supplied back to the server when operation is completed. The session has a limited lifetime which can be configured via  `sessionDuration`.
