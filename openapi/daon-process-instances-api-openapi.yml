openapi: 3.2.0
info:
  title: Daon Process Instances API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged Process Instances across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: Process Instances
paths:
  /api/process-manager/processInstances/{processInstanceId}/fraudState:
    get:
      tags:
      - Process Instances
      summary: Get Process Instance Fraud State
      description: 'Get the fraud state for a process instance. If no fraud state report has been made, returns null fraudState.


        API Permissions: `TNT#{tenantid}#ProcessManager:getProcessInstanceFraudState`'
      operationId: getProcessInstanceFraudState
      parameters:
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Fraud state returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceFraudStateResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient tenant permissions
        '404':
          description: Process instance not found
          content: {}
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:getProcessInstanceFraudState
    post:
      tags:
      - Process Instances
      summary: Update Process Instance Fraud State
      description: 'Update the fraud state for a process instance. Use NO_FRAUD_INDICATED to reset a previous fraud classification.


        API Permissions: `TNT#{tenantid}#ProcessManager:updateProcessInstanceFraudState`'
      operationId: updateProcessInstanceFraudState
      parameters:
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessInstanceFraudStateRequest'
        required: true
      responses:
        '200':
          description: Fraud state updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceFraudStateResponse'
        '400':
          description: Invalid request body
          content: {}
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient tenant permissions
        '404':
          description: Process instance not found
          content: {}
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:updateProcessInstanceFraudState
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/{processInstanceId}:
    get:
      tags:
      - Process Instances
      summary: Get a Process Instance
      description: 'Get a Process Instance based an ID.


        API Permissions: `TNT#{tenantid}#ProcessManager:getProcessInstance`'
      operationId: getProcessInstance
      parameters:
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceDetailsDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:getProcessInstance
    delete:
      tags:
      - Process Instances
      summary: Delete a Process Instance
      description: 'Delete a Process Instance based an ID.


        API Permissions: `TNT#{tenantid}#ProcessManager:deleteProcessInstance`'
      operationId: deleteProcessInstance
      parameters:
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: force
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: deleteTrends
        in: query
        description: When true, deletes associated trends related to this process instance after this process instance is removed.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:deleteProcessInstance
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/csv:
    post:
      tags:
      - Process Instances
      summary: Export process instance search results to CSV
      description: 'List Process Instances based on a filter and export results to a CSV file.


        API Permissions: `TNT#{tenantid}#ProcessManager:exportProcessInstancesToCsv`'
      operationId: exportProcessInstancesToCsv
      parameters:
      - name: searchString
        in: query
        description: The string of text to search. This can be a name, email etc.
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: The string of text to search. This can be a name, email etc.
      - name: processDefinitionId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: processDefinitionName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: processInstanceStatus
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - COMPLETED_TERMINATED
          - COMPLETED_ENDED_ERROR
          - COMPLETED_ENDED_SUCCESS
          - REVIEW
          - PAUSED
          - COMPLETED_PROCESS_ERROR
      - name: versionName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: startDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: endDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: forTest
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveConfig'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: BETA
      x-permission: TNT#{tenantid}#ProcessManager:exportProcessInstancesToCsv
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/byIds:
    post:
      tags:
      - Process Instances
      summary: Get Process Instances by IDs
      description: 'Retrieve a list of process instances matching the provided IDs. Duplicate IDs are silently deduplicated; each matching instance is returned at most once.


        API Permissions: `TNT#{tenantid}#ProcessManager:getProcessInstancesByIds`'
      operationId: getProcessInstancesByIds
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInstanceByIdsRequestDto'
        required: true
      responses:
        '200':
          description: List of process instances matching the provided IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessManageProcessInstanceSearchResultDto'
        '400':
          description: Invalid request (empty ID list or exceeds maximum size)
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessManageProcessInstanceSearchResultDto'
        '403':
          description: Forbidden - insufficient tenant permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessManageProcessInstanceSearchResultDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:getProcessInstancesByIds
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/create:
    post:
      tags:
      - Process Instances
      summary: Create a Process Instance
      description: 'Create a Process Instance.


        API Permissions: `TNT#{tenantid}#ProcessManager:createProcessInstance`'
      operationId: createProcessInstance
      parameters:
      - name: pt
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: includeThemeUrl
        in: query
        description: When true, includes the theme URL as a query parameter in the redirect URL response
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          description: When true, includes the theme URL as a query parameter in the redirect URL response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInstanceCreateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectionUrlDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:createProcessInstance
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/search:
    get:
      tags:
      - Process Instances
      summary: Search Process Instances
      description: 'Search Process Instances based on the provided criteria.


        API Permissions: `TNT#{tenantid}#ProcessManager:searchProcessInstancesBetweenDates`'
      operationId: searchProcessInstancesBetweenDates
      parameters:
      - name: searchString
        in: query
        description: The string of text to search. This can be a name, email etc.
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: The string of text to search. This can be a name, email etc.
      - name: processDefinitionId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: processDefinitionName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: processInstanceStatus
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - COMPLETED_TERMINATED
          - COMPLETED_ENDED_ERROR
          - COMPLETED_ENDED_SUCCESS
          - REVIEW
          - PAUSED
          - COMPLETED_PROCESS_ERROR
      - name: versionName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: startDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: endDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: direction
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: sortColumn
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: sort
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: forTest
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageProcessManageProcessInstanceSearchResultDto'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:searchProcessInstancesBetweenDates
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances/{processInstanceId}/processInstanceArchive:
    post:
      tags:
      - Process Instances
      summary: Generate a process instance data zip archive
      description: 'Generates a zip archive containing all user data files and activity stream for a process instance.


        API Permissions: `TNT#{tenantid}#ProcessManager:generateProcessInstanceZipArchive`'
      operationId: generateProcessInstanceZipArchive
      parameters:
      - name: processInstanceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveConfig'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:generateProcessInstanceZipArchive
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/process-manager/processInstances:
    get:
      tags:
      - Process Instances
      summary: List Process Instances
      description: 'List Process Instances based on a filter.


        API Permissions: `TNT#{tenantid}#ProcessManager:listProcessInstancesBetweenDates`'
      operationId: listProcessInstancesBetweenDates
      parameters:
      - name: startDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
          default: 0
      - name: endDateTime
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 1
      - name: sort
        in: query
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProcessInstance'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:listProcessInstancesBetweenDates
    post:
      tags:
      - Process Instances
      summary: Create a Process Instance (with redirect)
      description: 'Create a Process Instance with redirect.


        API Permissions: `TNT#{tenantid}#ProcessManager:createProcessInstanceAndRedirect`'
      operationId: createProcessInstanceAndRedirect
      parameters:
      - name: pt
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: includeThemeUrl
        in: query
        description: When true, includes the theme URL as a query parameter in the redirect URL response
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          description: When true, includes the theme URL as a query parameter in the redirect URL response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInstanceCreateDto'
      responses:
        '307':
          description: Temporary Redirect
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProcessManagerSkyError'
                - $ref: '#/components/schemas/AbstractSkyError'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractSkyError'
      x-visibility: GA
      x-permission: TNT#{tenantid}#ProcessManager:createProcessInstanceAndRedirect
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
