components:
  schemas:
    PasscodeSummary:
      type: object
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        policyName:
          type: string
          description: Identifies the identity store passcode policy.
        status:
          type: string
          description: The status of the user passcode.
          enum:
          - ACTIVE
          - DISABLED
        lastRenewedDtm:
          type: string
          format: date-time
          description: The last time the passcode was renewed. Only present if a renewal has occurred.
        expirationDate:
          type: string
          format: date
          description: Expiration date for a passcode. Only required if regular renewals are enforced.
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
          description: The time of the last authentication. If this passcode has not been used for authentication then this field is not present.
    UserAndFaceMatchResponseId:
      type: object
      description: The results of the face authentication
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
          description: The user for whom the authentication took place.
        transactionId:
          type: string
          description: A transaction ID of the face authentication.
        result:
          type: string
          description: "The result of an authentication. Possible values: \n- **SUCCESS**: The authentication succeeded.\n- **FAILED**: The authentication failed. The `errorMessage` and `errorCode` fields should be populated.\n"
          enum:
          - SUCCESS
          - FAILED
        score:
          type: number
          format: double
        threshold:
          type: number
          format: double
        sourceReference:
          $ref: '#/components/schemas/UserBiometricVersionId'
    FaceMatchingProcessesData:
      type: object
      default: DFV6`
      description: The list of matching algorithms to be run in preferred order based on data availability.
      example:
      - transformAlgorithm: DFV6E
        minConfidence: 3
        internalScore: 0.6
      properties:
        algorithm:
          type: string
          enum:
          - DFV6
          - DFV7
        threshold:
          type: number
          format: double
        internalThreshold:
          type: number
          format: double
    DeviceSummary:
      type: object
      description: 'Summary information about a device containing keys registered to the user.


        **NOTE** The device information is only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
      properties:
        id:
          type: string
          description: 'A unique identifier of the device on which the keys are installed


            **NOTE** This is actually an identifier of the client application in which the appkey has been created. It is only available if the `DEVICE_INFO` extension s enabled in the appkey registration policy.'
        rpId:
          type: string
          description: The relying party ID.
        os:
          type: string
          description: 'The device operating system, for example `iOS`.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        deviceType:
          type: string
          description: 'The device type: identifies the device model.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        name:
          type: string
          description: 'The device name: the device name if one has been registered by the device owner.


            **NOTE** Only available if the `DEVICE_INFO` extension is enabled in the appkey registration policy.'
        notificationToken:
          type: string
          description: A push notification token provided by the device
        invalidToken:
          type: boolean
          description: Present and true if the push notification token has been used for a previous push notification and is marked as unusable (invalid or unregistered).
        preferredDevice:
          type: boolean
          description: Present and true if this is the preferred device to receive notifications for this app.
        keys:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AppkeySummary'
          description: 'A map of appkey types to list of key summary information where the key types are:

            - **DEVICE**: A device appkey which authenticates the device without user input.

            - **BIOMETRIC**: A biometric appkey which authenticates the user using a biometric.

            List is here to support "more than one app keys of the same type" concept, but in most cases we expect the size of it will be one.'
    SecretSummary:
      type: object
      description: 'Summary information about a secret registered to the user.


        **NOT USED IN THIS RELEASE**'
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          - TEMP_LOCKED
        lastAuthenticatedWithDtm:
          type: string
          format: date-time
    TrustXLocale:
      type: object
      description: Locale information. Exposes the language, country and variant locale components, for example `en_US_UNIX` contains these components as `en`, `US` and `UNIX` respectively.
      properties:
        language:
          type: string
          description: The mandatory locale language component
        country:
          type: string
          description: The optional locale country component
        variant:
          type: string
          description: The optional locale variant component
    IdStoreSkyError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        extraDetail:
          type: string
    LocationByIpInfo:
      type: object
      description: Location metadata
      properties:
        ipAddress:
          type: string
        country:
          type: string
        city:
          type: string
    UserLocks:
      type: object
      description: 'User lock information.


        Describes locks at the user level and modality level. A user can have escalating temporary locks which come into effect after a certain number of consecutive authentication attempts. The number of locks and the lock durations are configured at the store level.


        **NOTE**: Currently only user-level locking is supported with modality level locking planned for a later release.'
      properties:
        lockCounter:
          type: integer
          format: int32
          description: The number of consecutive locks tagged for this user.
        tempLockedAt:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock came into effect.
        tempLockedUntil:
          type: string
          format: date-time
          description: If the user is *temporarily* locked then this is the time at which the lock ends.
        lockedAt:
          type: string
          format: date-time
          description: If the user is *permanently* locked then this is the time at which the lock came into effect.
        userModalityLocks:
          type: array
          description: 'Locking information related to particular authentication modalities.


            **Not supported in this release**'
          items:
            $ref: '#/components/schemas/UserModalityLock'
    UserSummaryInfo:
      type: object
      description: Summary information about items registered to the user such as biometrics, appkeys and passkeys.
      properties:
        biometrics:
          type: array
          description: A list of biometrics registered to the user
          items:
            $ref: '#/components/schemas/BiometricSummary'
        documents:
          type: array
          description: 'A list of documents registered to the user

            **NOT USED IN THIS RELEASE**'
          items:
            $ref: '#/components/schemas/DocumentSummary'
        secrets:
          type: array
          description: 'A list of secrets registered to the user

            **NOT USED IN THIS RELEASE**'
          items:
            $ref: '#/components/schemas/SecretSummary'
        passkeys:
          type: array
          description: A list of passkeys registered to the user
          items:
            $ref: '#/components/schemas/PasskeySummary'
        appkeys:
          type: array
          description: A list of appkeys registered to the user
          items:
            $ref: '#/components/schemas/AppkeySummary'
        totps:
          type: array
          description: A list of TOTPs registered to the user
          items:
            $ref: '#/components/schemas/TOTPSummary'
        passcodes:
          type: array
          description: A list of passcodes registered to the user
          items:
            $ref: '#/components/schemas/PasscodeSummary'
    VoiceAuthenticationResult:
      type: object
      description: The result details of a completed voice authentication.
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
          description: The user for whom the authentication took place.
        transactionId:
          type: string
          description: A transaction ID of the voice authentication.
        result:
          type: string
          description: The result of the voice authentication.
          enum:
          - SUCCESS
          - FAILED
        rawScore:
          type: number
          format: double
          description: The raw match score.
        score:
          type: number
          format: double
          description: The match score which must be equal to or below the threshold for a match to succeed.
        threshold:
          type: number
          format: double
          description: The match threshold.
        version:
          type: string
          description: The optional voice matching algorithm version.
        policy:
          type: string
          description: The voice matching policy used.
        sourceReference:
          $ref: '#/components/schemas/UserBiometricVersionId'
          description: Information about the reference biometric version.
        auditPath:
          type: string
          description: The API endpoint to retrieve the authentication audit details. Null if the audit is not available.
    UserAgentInfo:
      type: object
      description: User agent metadata
      properties:
        name:
          type: string
        version:
          type: string
    VoiceAuthenticationRequest:
      type: object
      description: A request to initiate a voice authentication. Contains the sample to be authenticated and optional configuration and client context data.
      properties:
        metadata:
          $ref: '#/components/schemas/TrustWebClientMetadata'
          description: Client metadata to be audited
        context:
          type: object
          additionalProperties:
            type: object
          description: Additional client context data to be audited
        sample:
          $ref: '#/components/schemas/UserBiometric'
          description: The biometric sample to be authenticated. The type, subtype, data and status must be set.
    AddUserBiometricAndCreateUserRequest:
      type: object
      description: A request to enrol a biometric, creating the user to hold the enrolment if one does not already exist.
      properties:
        userExtId:
          type: string
          description: The optional external ID of the user. If a user with this external ID exists the biometric is enrolled against that user, otherwise a new user is created with this external ID. If not supplied a new user is created with a generated GUID as its external ID.
        userBiometric:
          $ref: '#/components/schemas/UserBiometric'
          description: The biometric to enrol. The `type`, `subtype` and `data` fields are mandatory and the data must match the `subtype`.
      required:
      - userBiometric
    UserBiometricVersionData:
      type: object
      properties:
        data:
          type: string
