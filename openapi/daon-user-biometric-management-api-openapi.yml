      description: 'Summary information about a document registered to the user.


        **NOT USED IN THIS RELEASE**'
      properties:
        id:
          type: string
          description: The database identifier of the entity
        createdDtm:
          type: string
          format: date-time
        lastUpdatedDtm:
          type: string
          format: date-time
    UserDto:
      type: object
      description: A user in an identity store.
      properties:
        id:
          type: string
          description: Unique 26-character database user ID.
        storeName:
