  /api/identity-store/stores/{storeName}/users/{extId}/biometrics/{id}/ext:
    delete:
      tags:
      - User Biometric Management
      summary: Delete a user biometric by external user ID and biometric ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:deleteUserBiometricByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:deleteUserBiometricByExtId`'
      operationId: deleteUserBiometricByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: ID of the biometric
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: includeVersions
        in: query
        description: Should the biometric versions be deleted
        required: true
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: User biometric deleted successfully
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2001**: Biometric not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:deleteUserBiometricByExtId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{userId}/biometrics:
    get:
      tags:
      - User Biometric Management
      summary: List biometrics for a user identified by internal ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserBiometrics` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserBiometrics`'
      operationId: listUserBiometrics
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userId
        in: path
        description: ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User biometrics retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBiometric'
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **500**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '500'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUserBiometrics
    post:
      tags:
      - User Biometric Management
      summary: Add or update biometric within an identity store for a user identified by its…
      description: 'If a biometric for this user with the specified type and subtype already exists then the following fields will be updated from the request:

        - atributes- createdFromRefs- data- status.


        Otherwise a new biometric entry will be created using the details in the request with the user and store details set to reference the user and store specified in the request parameters.


        **NOTE**: The `type`, `subtype` and `data` fields of the biometric object are mandatory and the data must match the `subtype`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:addUserBiometric` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:addUserBiometric`'
      operationId: addUserBiometric
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
