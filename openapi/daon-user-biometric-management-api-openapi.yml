openapi: 3.2.0
info:
  title: Daon User Biometric Management API
  version: '1.0'
  contact:
    email: support@daon.com
  termsOfService: https://docs.trustx.com
  description: 'Operations tagged User Biometric Management across 2 of this provider''s published API definitions: daon-trustx-openapi.yml, daon-trustx-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenantId}.fir.trustx.com
  description: URL for fir regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.gum.trustx.com
  description: URL for gum regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
- url: https://{tenantId}.oak.trustx.com
  description: URL for oak regional system
  variables:
    tenantId:
      description: The tenant ID
      default: myTenantId
security:
- BearerAuth: []
tags:
- name: User Biometric Management
paths:
  /api/identity-store/stores/{storeName}/users/{extUserId}/biometrics/types/{type}/subtypes/{subtype}/versions/ext:
    get:
      tags:
      - User Biometric Management
      summary: List biometric verisons for a user identified by external ID, the type and…
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserBiometricVersionsByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserBiometricsByExtUserId`'
      operationId: listUserBiometricVersionsByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extUserId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: type
        in: path
        description: The type of the biometric
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: subtype
        in: path
        description: The subtype of the biometric
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User biometric versions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBiometricVersion'
        '400':
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:listUserBiometricsByExtUserId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.gum.trustx.com
      description: URL for gum regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
    - url: https://{tenantId}.oak.trustx.com
      description: URL for oak regional system
      variables:
        tenantId:
          description: The tenant ID
          default: myTenantId
  /api/identity-store/stores/{storeName}/users/{extUserId}/biometrics/ext:
    get:
      tags:
      - User Biometric Management
      summary: List biometrics for a user identified by external ID
      description: '### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:listUserBiometricsByExtUserId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:listUserBiometricsByExtUserId`'
      operationId: listUserBiometricsByExtUserId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extUserId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: User biometrics retrieved successfully
          content:
