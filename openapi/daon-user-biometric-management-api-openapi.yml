  /api/identity-store/stores/{storeName}/users/{userExtId}/biometrics/authentications/voice/ext:
    post:
      tags:
      - User Biometric Management
      summary: Initiate voice authentication for a user where the user is identified by their…
      description: 'Initiates a voice authentication session for the specified user. A voice sample must be provided with a `type` of `Voice`, a `subtype` such as `DVASVTI5_8K`, the `data` set to the audio data and a status, typically set to `ACTIVE`.


        A session is created and a session ID is returned in the response. The session ID is used to continue the authentication with additional audio samples using the `continueAuthenticateVoice` API.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:authenticateVoiceByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:authenticateVoiceByExtId`'
      operationId: authenticateVoiceByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: userExtId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Information about the voice authentication
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceAuthenticationRequest'
        required: true
      responses:
        '200':
          description: Voice authentication session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAuthenticationResponse'
        '400':
          description: 'An error occurred.


            Possible error codes:

            - `2012` - The biometric type is missing.

            - `2022` - The request biometric contains call metadata but an unexpected sourceType attribute.

            - `2023` - A chunk reference is not in the expected format.

            - `2024` - A chunk reference has a tenant ID that does not match the request tenant ID.

            - `2025` - A chunk reference has a channel inconsistent with the previous chunk for the same call.

            - `2026` - A chunk reference has a call ID that does not match the current call.

            - `2027` - A chunk reference has a start time before the call start time.

            - `2028` - A chunk reference has a created time before the audio start time.

            - `2029` - The chunk references are not in time order.

            - `2100` - The user is locked and cannot be authenticated.

            - `2101` - The user''s modality is locked and cannot be authenticated.

            - `2102` - The user is disabled and cannot be authenticated.

            - `2104` - No active and complete biometric data was found for the user.

            - `3020` - The voice authentication sample data is missing.

            - `3024` - The request supplies chunk references but the session has none.

            - `3025` - The request supplies call metadata but the session has none.

            - `3026` - The callMetadata attribute is invalid or missing required fields.

            - `3027` - The callMetadata attribute is missing the required callId field.

            - `3032` - The biometric status is invalid for this operation.

            - `3036` - There is no suitable voice data available for matching against the presented sample.

            - `3044` - Too many audio chunks were supplied for consolidation.

            - `3045` - The supplied audio chunks belong to more than one call.

            - `3046` - The supplied audio chunks belong to more than one channel.

            - `3047` - The referenced audio chunks could not be found.

            - `3048` - An error occurred while consolidating the authentication audio.

            - `3049` - Voice authentication is not configured for the store.

            - `3050` - The ASV transform service returned a client error.

            - `3051` - The ASV transform service returned a server error.

            - `3052` - The ASV transform service returned an invalid response.

            - `3053` - The voice transform failed with a continuity error.

            - `3054` - The ASV verify service returned a client error.

            - `3055` - The ASV verify service returned a server error.

            - `3056` - The ASV verify service returned an invalid response.

            - `3058` - The biometric request contains an invalid configuration.

            - `3059` - The biometric request contains an invalid QC template.

            - `3060` - No suitable ROC curve was found for the supplied speech durations.

            - `3061` - No ASV TI service configuration was found for the store.

            - `20114` - The biometric data is missing.

            - `20115` - The biometric type is not supported.

            - `20118` - All supplied biometric data must be of the same type.

            - `20119` - All supplied biometric data must be of the same subtype.'
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2009**: No biometric data of the requested type was found for the user.

            - **2010**: No biometric data of the requested type and subtype was found for the user.

            - **2013**: No biometric data was found for the user.

            - **2103**: The user''s biometric is disabled and an authentication cannot be performed.

            '
          content:
            application/json: {}
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:authenticateVoiceByExtId
