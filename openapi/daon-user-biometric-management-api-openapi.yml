  /api/identity-store/stores/{storeName}/biometrics:
    post:
      tags:
      - User Biometric Management
      summary: Enrol a biometric within an identity store, creating the user to hold the…
      description: 'Enrols a biometric and, as part of the same operation, gets or creates the user that holds it.


        If `userExtId` is supplied and a user with that external ID exists, the biometric is enrolled against that user. If no such user exists, a user is created with the supplied external ID. If `userExtId` is not supplied, a user is created with a generated GUID as its external ID.


        **NOTE**: The `userBiometric` object is mandatory and its `type`, `subtype` and `data` fields are mandatory and the data must match the `subtype`.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:addUserBiometricAndCreateUser` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:addUserBiometricAndCreateUser`'
      operationId: addUserBiometricAndCreateUser
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      requestBody:
        description: The optional external ID of the user and the biometric to enrol
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserBiometricAndCreateUserRequest'
        required: true
      responses:
        '201':
          description: Biometric enrolled and user created/retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserBiometricAndCreateUserResponse'
        '400':
          description: 'An error occurred. Possible error codes:

            - **2002**: A biometric for this user with a duplicate type and subtype exists

            - **2003**: A data integrity violation occurred when saving the biometric to the database

            - **2004**: The biometric metadata resource could not be loaded.

            - **2005**: The biometric type is not supported

            - **2006**: The biometric subtype is not supported by the biometric metadata.

            - **2012**: The biometric is missing or the biometric type is missing.

            - **2014**: The subtype biometric data is too long for the specified subtype and can''t be stored in the database.

            - **2015**: The user is not in a state to allow this operation.

            - **2018**: The required validation service was not found in the biometric metadata.

            - **2019**: The configured validation service is not of the expected type.

            - **2020**: The supplied ASV TI voice template is missing the required speechDuration attribute.

            - **2021**: The supplied ASV TI voice template has an invalid speechDuration value.

            - **2022**: The request biometric contains call metadata but an unexpected sourceType attribute.

            - **2023**: A chunk reference is not in the expected format.

            - **2024**: A chunk reference has a tenant ID that does not match the request tenant ID.

            - **2025**: A chunk reference has a channel inconsistent with the previous chunk for the same call.

            - **2026**: A chunk reference has a call ID that does not match the current call.

            - **2027**: A chunk reference has a start time before the call start time.

            - **2028**: A chunk reference has a created time before the audio start time.

            - **2029**: The chunk references are not in time order.

            - **3024**: The request supplies chunk references but the existing partial enrolment has none.

            - **3025**: The request supplies call metadata but the existing partial enrolment has none.

            - **3026**: The callMetadata attribute is invalid or missing required fields.

            - **3027**: The callMetadata attribute is missing the required callId field.

            - **3028**: No partial reference biometric was found to update during enrolment.

            - **3029**: Failed to consolidate the voice biometric audio data.

            - **3030**: No voice biometric data was found in the request.

            - **3031**: No voice biometric data was found in the stored version.

            - **3032**: The biometric status is invalid for this operation.

            - **3034**: The configured TI voice service is newer than the one used to start the partial enrolment and legacy continuation is disabled.

            - **3035**: The stored partial enrolment biometric is invalid.

            - **3037**: The request call metadata callId does not match the last callId of the existing partial enrolment.

            - **3042**: A partial enrolment is already in progress for this user, type and subtype.

            - **3049**: Voice authentication is not configured for the store.

            - **3050**: The ASV transform service returned a client error.

            - **3051**: The ASV transform service returned a server error.

            - **3052**: The ASV transform service returned an invalid response.

            - **3053**: The voice transform failed with a continuity error.

            - **3058**: The biometric request contains an invalid configuration.

            - **3059**: The biometric request contains an invalid QC template.

            - **3060**: No suitable ROC curve was found for the supplied speech durations.

            - **3061**: No ASV TI service configuration was found for the store.

            - **20113**: The biometric subtype is missing.

            - **20114**: The biometric data is missing.

            - **20120**: An error occurred while generating the face template (face transformation service returned an error).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '123'
                message: An error message
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **1000**: The biometric object could not be stored in or retrieved from the object store (S3).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '100'
                message: The specified store could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:addUserBiometricAndCreateUser
