          - ACTIVE
          - TEMP_LOCKED
          - LOCKED
          - DISABLED
        extId:
          type: string
          description: A unique ID of the user supplied by the customer.
        type:
          type: string
          description: A user type supplied by the customer.
        locale:
          $ref: '#/components/schemas/TrustXLocale'
          description: The user's locale. The default locale configured at the store level.
        timezone:
          type: string
          description: The user's timezone. The default timezone configured at the store level.
          example: Europe/London
        firstName:
          type: string
          description: The user's first name.
        lastName:
          type: string
          description: The user's last name.
        email:
          type: string
          description: The user's email address.
        dateOfBirth:
          type: string
          format: date
          description: The user's date of birth.
