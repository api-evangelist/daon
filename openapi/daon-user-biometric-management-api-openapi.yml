  /api/identity-store/stores/{storeName}/users/{extId}/biometrics/authentications/face/ext:
    post:
      tags:
      - User Biometric Management
      summary: Perform a biometric face match. The user is identified by its external ID
      description: 'The face matching takes place within the identity store and the success or failure event is created. A face match sample must be provided with a `type` of `Face`, a `subtype` of `Image` or a supported template type, the `data` set to the image or template data and a status, typically set to `ACTIVE`.


        If the `storeAudit` configuration field is set to `true` in the identity store''s biometric authentication configuration then a detailed audit of the biometric authentication is created.


        ### Permission

        The JWT must contain the `TNT#{tenant}#IdentityStore:matchFaceByExtId` permission.


        API Permissions: `TNT#{tenant}#IdentityStore:matchFaceByExtId`'
      operationId: matchFaceByExtId
      parameters:
      - name: storeName
        in: path
        description: Name of the store
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: testStore
      - name: extId
        in: path
        description: External ID of the user
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Information about the face authentication
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceMatchRequest'
        required: true
      responses:
        '200':
          description: Face matched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAndFaceMatchResponseId'
        '400':
          description: 'An error occurred - including the face match failing.


            **NOTE** For convenience the updated user object is returned when there is a face match failure because it may contain updated information about the user lock state.


            Possible error codes:

            - **8**: Face algorithm not supported

            - **2006**: The biometric subtype is not supported

            - **2100**: The user is locked so authentication cannot be performed

            - **2101**: The face modality is locked so authentication cannot be performed

            - **2102**: The user is disabled so authentication cannot be performed

            - **2103**: The presented biometric is disabled so authentication cannot be performed

            - **20114**: Biometric data is not supplied in the request

            - **20115**: The specified biometric type is not supported

            - **20120**: An unexpected error occurred while generating face template

            - **20121**: An error occurred while attempting to perform a face match

            - **20122**: There is no suitable face data available for matching against the presented sample

            - **20123**: The matching process data is missing from the request

            - **20124**: The matching algorithm is missing from the request

            - **20125**: The matching threshold must be between 0 and 1

            - **20126**: The internal matching threshold must be between 0 and 1

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
              example:
                code: '401'
                message: Authentication failed
                user:
                  id: EEWOIHIJ3CJYXAKIRGAMEIUJGU
                  status: ACTIVE
                  extId: '12345678'
                  locale:
                    language: en
                    country: US
                  timezone: Europe/London
                  firstName: John
                  lastName: Does
                  email: jd@mail.com
                  dateOfBirth: {}
                  nationalities:
                  - US
                  locks:
                    lockCounter: 1
                  createdDtm: {}
                  lastUpdatedDtm: {}
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
        '404':
          description: 'A required entity was not found. Possible error codes:

            - **90**: Tenant not found

            - **100**: Store not found

            - **503**: User not found

            - **2013**: Biometric data not found for the specified user

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStoreSkyError'
              example:
                code: '503'
                message: The specified user could not be found.
      x-visibility: EARLY_ACCESS
      x-permission: TNT#{tenant}#IdentityStore:matchFaceByExtId
    servers:
    - url: https://{tenantId}.fir.trustx.com
      description: URL for fir regional system
      variables:
